name: Frontend boundary

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  frontend-scope:
    name: Frontend scope
    runs-on: ubuntu-latest
    steps:
      # Read the guard from the trusted base, never from the PR.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check frontend-only changes
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$HEAD_BRANCH" != frontend/* ]]; then
            echo "Backend/maintenance PR: frontend scope does not apply."
            exit 0
          fi
          git fetch origin "refs/pull/$PR_NUMBER/head:refs/remotes/pull/head"
          node scripts/check-frontend-scope.mjs "$BASE_SHA" refs/remotes/pull/head
      - name: Check frontend handoff report
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$HEAD_BRANCH" != frontend/* ]]; then
            echo "Backend/maintenance PR: frontend handoff does not apply."
            exit 0
          fi
          node scripts/check-frontend-report.mjs "$BASE_SHA" refs/remotes/pull/head
