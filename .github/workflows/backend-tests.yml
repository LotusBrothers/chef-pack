name: Backend tests
on:
  pull_request:
    branches: [main]
  push:
    branches: ['backend/**']
permissions:
  contents: read
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/backend/*.test.mjs
