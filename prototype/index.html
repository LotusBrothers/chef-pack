<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Chef Pack">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>body{margin:0}</style>
</head>
<body>
<title>Chef Pack</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&display=swap">
<style>
  /* Layout: a mobile app shell (100dvh column, max 480px): fixed top bar, one scrolling content area, fixed tab bar or order bar.
     Gift cards are the product: brand-color card tiles (real card art from the gift card provider replaces them later).
     World: DoorDash-clean. White, near-black, one green for "guaranteed"/"upgraded". Minimal motion. */
  :root {
    color-scheme: light;
    --bg: #ffffff;
    --desk: #ececec;
    --surface: #f5f5f5;
    --surface-2: #ebebeb;
    --line: #e8e8e8;
    --fg: #191919;
    --muted: #6b6b6b;
    --green: #0a8a4a;
    --green-bg: #e7f5ed;
    --font: "Figtree", -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
    --gutter: 16px;
  }
  html, body { height: 100%; }
  html { background: var(--desk); }
  body { background: var(--desk); color: var(--fg); font: 400 16px/1.4 var(--font); -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
    overflow: hidden; overscroll-behavior: none; touch-action: manipulation; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; -webkit-user-select: none; user-select: none; }
  a { color: inherit; text-decoration: none; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; border-radius: 10px; }

  /* ---------- Shell ---------- */
  .app { position: relative; height: 100%; max-width: 480px; margin: 0 auto; background: var(--bg); display: flex; flex-direction: column; overflow: hidden; }
  @media (min-width: 520px) { .app { box-shadow: 0 0 0 1px var(--line), 0 20px 60px rgba(0,0,0,.07); } }
  .scroll { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain; scrollbar-width: none;
    padding: 2px max(var(--gutter), var(--safe-r)) 28px max(var(--gutter), var(--safe-l)); }
  .scroll::-webkit-scrollbar { display: none; }
  .top { flex: none; background: var(--bg); padding: calc(var(--safe-t) + 8px) max(var(--gutter), var(--safe-r)) 10px max(var(--gutter), var(--safe-l)); z-index: 5; }
  .top.shadow { box-shadow: 0 1px 0 var(--line); }
  .bar { display: flex; align-items: center; gap: 8px; min-height: 44px; }
  .brand { display: flex; align-items: center; gap: 7px; background: none; border: 0; padding: 0; min-height: 44px; flex: none; }
  .brand svg { width: 26px; height: 26px; }
  .brand b { font-size: 19px; font-weight: 900; letter-spacing: -.03em; }
  .grow { flex: 1; min-width: 0; }
  .pill { display: inline-flex; align-items: center; gap: 5px; background: var(--surface); border: 0; border-radius: 99px; padding: 0 12px; height: 36px; font-weight: 700; font-size: 14px; white-space: nowrap; }
  .pill svg { width: 15px; height: 15px; flex: none; }
  .bal { display: inline-flex; align-items: center; gap: 6px; background: var(--fg); color: #fff; border: 0; border-radius: 99px; padding: 0 12px; height: 36px; font-weight: 800; font-size: 14px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .bal svg { width: 15px; height: 15px; }
  .round { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--surface); display: grid; place-items: center; flex: none; }
  .round svg { width: 20px; height: 20px; }
  .bartitle { flex: 1; min-width: 0; text-align: center; font-weight: 800; font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .search { display: flex; align-items: center; gap: 10px; background: var(--surface); border-radius: 99px; padding: 0 16px; height: 44px; margin-top: 8px; }
  .search svg { width: 18px; height: 18px; flex: none; color: var(--muted); }
  /* 16px input text stops iOS Safari from zooming in on focus. */
  .search input { border: 0; background: none; outline: 0; width: 100%; font-size: 16px; min-width: 0; -webkit-appearance: none; appearance: none; }
  .search input::placeholder { color: var(--muted); }
  .search input::-webkit-search-cancel-button { -webkit-appearance: none; }
  .tabbar { flex: none; display: grid; grid-template-columns: repeat(3, 1fr); background: var(--bg); border-top: 1px solid var(--line);
    padding: 4px max(8px, var(--safe-r)) max(8px, var(--safe-b)) max(8px, var(--safe-l)); z-index: 5; }
  .tabbar button { background: none; border: 0; display: grid; justify-items: center; align-content: center; gap: 3px; min-height: 50px; font-size: 11px; font-weight: 700; color: #8a8a8a; position: relative; }
  .tabbar button svg { width: 24px; height: 24px; }
  .tabbar button[aria-current="page"] { color: var(--fg); }
  .tabbar .dot { position: absolute; top: 4px; left: calc(50% + 8px); min-width: 18px; height: 18px; border-radius: 9px; background: var(--fg); color: #fff; font-size: 11px; font-weight: 800; line-height: 18px; padding: 0 5px; }
  .orderbar { flex: none; background: var(--bg); border-top: 1px solid var(--line); padding: 10px max(var(--gutter), var(--safe-r)) max(10px, var(--safe-b)) max(var(--gutter), var(--safe-l)); z-index: 5; display: grid; gap: 6px; }
  .orderbar .btn { height: 52px; font-size: 17px; width: 100%; }
  .orderbar .btn .sum { margin-left: auto; font-variant-numeric: tabular-nums; }
  .orderbar .fine { text-align: center; color: var(--muted); font-size: 12px; }
  .in-fade { animation: fade .18s ease-out both; }
  @keyframes fade { from { opacity: 0; } }

  /* ---------- Shared ---------- */
  .btn { border: 0; border-radius: 99px; padding: 0 20px; min-height: 48px; font-weight: 800; font-size: 16px; background: var(--fg); color: #fff; display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; }
  .btn:active { opacity: .85; }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.soft { background: var(--surface); color: var(--fg); }
  .btn.white { background: #fff; color: var(--fg); }
  .sh { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin: 26px 0 12px; }
  .sh h2 { margin: 0; font-size: 21px; font-weight: 800; letter-spacing: -.02em; }
  .sh small { color: var(--muted); font-size: 14px; font-weight: 700; white-space: nowrap; }
  .guar { color: var(--green); font-weight: 700; }

  /* ---------- Gift card: one premium black card for every brand ---------- */
  .gc { position: relative; aspect-ratio: 1.586; border-radius: 5.5% / 8.7%; container-type: inline-size; overflow: hidden; color: #fff;
    background:
      repeating-linear-gradient(115deg, rgba(255,255,255,.018) 0 1px, transparent 1px 3px),
      radial-gradient(120% 90% at 0% 0%, #2c2c2c 0%, #121212 48%, #070707 100%);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
  .gc::after { content: ""; position: absolute; inset: 0; background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,.07) 45%, transparent 60%); pointer-events: none; }
  .gc .gtop { position: absolute; left: 6.5%; top: 9%; display: flex; align-items: center; gap: 2cqi; font-size: 4.6cqi; font-weight: 800; letter-spacing: .18em; color: rgba(255,255,255,.55); }
  .gc .gtop svg { width: 6cqi; height: 6cqi; }
  .gc .gmark { position: absolute; inset: 22% 8% 26%; display: grid; place-items: center; text-align: center; }
  .gc .gmark .gn { font-weight: 800; letter-spacing: -.01em; line-height: 1.02; text-wrap: balance; }
  .gc .gmark svg { height: 100%; max-width: 70%; fill: #fff; }
  .gc .gbot { position: absolute; left: 6.5%; right: 6.5%; bottom: 9%; display: flex; justify-content: space-between; align-items: baseline; }
  .gc .gbot span { font-size: 4.2cqi; font-weight: 700; letter-spacing: .2em; color: rgba(255,255,255,.5); }
  .gc .gbot b { font-size: 9cqi; font-weight: 800; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
  .gc .acc { position: absolute; left: 0; right: 0; bottom: 0; height: 1.6cqi; background: var(--a); opacity: .9; }
  .gc .gimg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .gc.settle { animation: settle .35s cubic-bezier(.2,1.3,.4,1) both; }
  @keyframes settle { from { transform: scale(.94); } }
  @container (max-width: 130px) { .gc .gtop, .gc .gbot span { display: none; } .gc .gmark { inset: 14% 8% 18%; } }

  /* ---------- Home ---------- */
  .chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 4px calc(-1 * var(--gutter)) 0; padding: 0 var(--gutter); }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; height: 36px; padding: 0 14px; border-radius: 99px; border: 0; background: var(--surface); font-weight: 700; font-size: 14px; }
  .chip[aria-pressed="true"] { background: var(--fg); color: #fff; }
  .promo { margin-top: 14px; border-radius: 16px; background: #191919; color: #fff; padding: 18px; display: grid; grid-template-columns: minmax(0, 1fr) 120px; gap: 10px; align-items: center; }
  .promo h1 { margin: 0; font-size: 22px; line-height: 1.1; font-weight: 900; letter-spacing: -.03em; }
  .promo p { margin: 6px 0 14px; color: #bdbdbd; font-size: 14px; }
  .promo .btn { min-height: 40px; font-size: 14px; padding: 0 16px; }
  .promo .fan { position: relative; height: 92px; }
  .promo .fan .gc { position: absolute; width: 84px; box-shadow: 0 6px 16px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.14); }
  .promo .fan .gc:nth-child(1) { left: 0; top: 18px; transform: rotate(-8deg); }
  .promo .fan .gc:nth-child(2) { left: 18px; top: 6px; transform: rotate(-1deg); }
  .promo .fan .gc:nth-child(3) { left: 36px; top: 20px; transform: rotate(7deg); }

  .hscroll { display: grid; grid-auto-flow: column; grid-auto-columns: 78%; gap: 12px; overflow-x: auto; scrollbar-width: none; margin: 0 calc(-1 * var(--gutter)); padding: 0 var(--gutter) 2px; scroll-snap-type: x mandatory; scroll-padding-left: var(--gutter); }
  .hscroll::-webkit-scrollbar { display: none; }
  .hscroll > * { scroll-snap-align: start; }
  .packs { display: grid; gap: 20px; }
  .pack { background: none; border: 0; padding: 0; text-align: left; display: grid; gap: 9px; min-width: 0; width: 100%; }
  .pi .tag { display: none; }
  .tag { display: inline-block; vertical-align: 2px; margin-left: 4px; background: var(--surface); color: var(--fg); font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 99px; }
  .pk { position: relative; aspect-ratio: 1.586; border-radius: 5.5% / 8.7%; container-type: inline-size; overflow: hidden; color: #fff; text-align: left;
    background:
      repeating-linear-gradient(115deg, rgba(255,255,255,.018) 0 1px, transparent 1px 3px),
      radial-gradient(120% 90% at 0% 0%, #2e2e2e 0%, #121212 48%, #060606 100%);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.09), 0 10px 24px rgba(0,0,0,.18); }
  .pk::after { content: ""; position: absolute; inset: 0; background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,.07) 45%, transparent 60%); pointer-events: none; }
  .pk .ptop { position: absolute; left: 6%; right: 6%; top: 8%; display: flex; justify-content: space-between; align-items: center; }
  .pk .brandmark { display: flex; align-items: center; gap: 1.8cqi; font-size: 4cqi; font-weight: 800; letter-spacing: .18em; color: rgba(255,255,255,.6); }
  .pk .brandmark svg { width: 5.4cqi; height: 5.4cqi; }
  .pk .ptag { font-size: 3.6cqi; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; background: rgba(255,255,255,.12); padding: 1.2cqi 2.6cqi; border-radius: 99px; }
  .pk .pname { position: absolute; left: 6%; right: 6%; top: 27%; font-size: 10.5cqi; font-weight: 900; letter-spacing: -.03em; line-height: 1; }
  .pk .pbrands { position: absolute; left: 6%; right: 6%; top: 44%; font-size: 3.9cqi; font-weight: 600; color: rgba(255,255,255,.62); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pk .pbot { position: absolute; left: 6%; right: 6%; bottom: 10%; display: flex; justify-content: space-between; align-items: flex-end; }
  .pk .pbot span { font-size: 3.6cqi; font-weight: 700; letter-spacing: .16em; color: rgba(255,255,255,.5); line-height: 1.5; }
  .pk .pbot span b { display: block; font-size: 6cqi; letter-spacing: -.01em; color: #fff; font-weight: 800; font-variant-numeric: tabular-nums; }
  .pk .pbot .pprice { font-size: 10cqi; font-weight: 900; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .pk .pacc { position: absolute; left: 0; right: 0; bottom: 0; height: 1.6cqi; background: var(--a); }
  .pi { display: flex; justify-content: space-between; gap: 10px; align-items: start; }
  .pi b { display: block; font-size: 16px; font-weight: 800; }
  .pi small { display: block; color: var(--muted); font-size: 14px; margin-top: 1px; }
  .pi .price { flex: none; background: var(--surface); border-radius: 99px; padding: 5px 11px; font-weight: 800; font-size: 14px; font-variant-numeric: tabular-nums; }
  .none { color: var(--muted); padding: 30px 16px; text-align: center; background: var(--surface); border-radius: 14px; }

  /* ---------- Gift card shelf ---------- */
  .shelf { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 12px; }
  .item { background: none; border: 0; padding: 0; text-align: left; display: grid; gap: 7px; min-width: 0; }
  .item b { font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .item span { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: -4px; }
  .item small { font-size: 12px; color: var(--muted); margin-top: -6px; }

  /* ---------- Pack screen ---------- */
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .stitle { margin-top: 14px; }
  .stitle h1:not(.sr) { margin: 16px 0 0; font-size: 28px; font-weight: 900; letter-spacing: -.03em; line-height: 1.1; }
  .meta { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 6px; color: var(--muted); font-size: 14px; }
  .meta b { color: var(--fg); font-weight: 700; }
  .values { margin-top: 16px; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .values div { display: flex; justify-content: space-between; padding: 12px 14px; border-top: 1px solid var(--line); font-size: 15px; }
  .values div:first-child { border-top: 0; background: var(--green-bg); }
  .values div:first-child span { color: var(--green); font-weight: 700; }
  .values b { font-weight: 800; font-variant-numeric: tabular-nums; }
  .values span { color: var(--muted); font-variant-numeric: tabular-nums; }

  /* ---------- Sheet ---------- */
  .scrim { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.4); display: flex; align-items: flex-end; justify-content: center; animation: fade .2s both; touch-action: none; }
  .sheet { position: relative; width: 100%; max-width: 480px; background: var(--bg); border-radius: 20px 20px 0 0; animation: up .28s cubic-bezier(.2,.9,.3,1) both; max-height: calc(100% - var(--safe-t) - 24px); overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y;
    padding: 22px 18px max(18px, var(--safe-b)); }
  @keyframes up { from { transform: translateY(100%); } }
  .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--surface-2); position: absolute; top: 8px; left: 50%; margin-left: -20px; }
  .x { position: absolute; top: 14px; right: 14px; width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--surface); display: grid; place-items: center; z-index: 3; }
  .x svg { width: 18px; height: 18px; }
  .slot { width: 74%; margin: 16px auto 0; }
  .slot .gc { box-shadow: 0 18px 36px rgba(0,0,0,.28); }
  .status { text-align: center; margin-top: 16px; color: var(--muted); font-weight: 600; font-size: 15px; min-height: 21px; }
  .status:empty { display: none; }
  .result { display: grid; gap: 4px; margin-top: 16px; animation: fade .25s both; }
  .eyebrow { color: var(--muted); font-size: 14px; font-weight: 600; margin: 0; }
  .result h2 { margin: 0; font-size: 26px; font-weight: 900; letter-spacing: -.03em; line-height: 1.1; }
  .result .sub { color: var(--muted); font-size: 14px; margin: 0; }
  .upg { justify-self: start; background: var(--green); color: #fff; font-weight: 800; font-size: 13px; padding: 4px 10px; border-radius: 99px; margin-bottom: 4px; }
  .valuebox { margin-top: 10px; display: flex; align-items: baseline; justify-content: space-between; gap: 10px; background: var(--surface); border-radius: 14px; padding: 12px 14px; }
  .valuebox b { font-size: 26px; font-weight: 900; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .valuebox s { color: var(--muted); font-size: 15px; margin-left: 6px; }
  .valuebox span { color: var(--muted); font-size: 13px; font-weight: 600; }
  .sacts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
  .sacts .btn { min-height: 50px; }
  .linkbtn { background: none; border: 0; color: var(--fg); font-weight: 700; font-size: 15px; text-decoration: underline; text-underline-offset: 3px; min-height: 44px; justify-self: center; }
  .linkbtn:disabled { color: var(--muted); text-decoration: none; cursor: default; }
  .barcode { height: 76px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; display: flex; align-items: stretch; margin-top: 12px; }
  .barcode i { background: #000; display: block; }
  .code { text-align: center; font-weight: 700; letter-spacing: .14em; font-size: 15px; margin-top: 8px; user-select: all; font-variant-numeric: tabular-nums; }
  .inpacks { display: grid; gap: 8px; margin-top: 8px; }
  .inpacks button { display: flex; justify-content: space-between; align-items: center; min-height: 52px; padding: 0 14px; border: 1px solid var(--line); border-radius: 12px; background: #fff; font-weight: 700; font-size: 15px; text-align: left; }
  .inpacks span { color: var(--muted); font-weight: 600; font-size: 14px; }

  /* ---------- Foil pack: the sealed pack you rip open ---------- */
  .foil { position: relative; width: 100%; aspect-ratio: .66; container-type: inline-size; filter: drop-shadow(0 14px 18px rgba(0,0,0,.3)); }
  .foil .bag { position: absolute; inset: 0; overflow: hidden; color: #fff;
    background: linear-gradient(100deg, #0b0b0b 0%, #2b2b2b 18%, #0e0e0e 34%, #232323 52%, #090909 70%, #303030 88%, #111 100%); }
  .foil .bag::before { content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, transparent 32%, rgba(255,255,255,.16) 47%, transparent 60%); }
  .foil .crimp { position: absolute; left: 0; right: 0; height: 7%; background: repeating-linear-gradient(90deg, rgba(255,255,255,.16) 0 1.2cqi, rgba(0,0,0,.3) 1.2cqi 2.4cqi); }
  .foil .crimp.t { top: 0; } .foil .crimp.b { bottom: 0; }
  .foil .fmark { position: absolute; top: 20%; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 2cqi; font-size: 6cqi; font-weight: 800; letter-spacing: .2em; color: rgba(255,255,255,.78); }
  .foil .fmark svg { width: 9cqi; height: 9cqi; }
  .foil .fname { position: absolute; top: 34%; left: 7%; right: 7%; text-align: center; font-size: 15cqi; font-weight: 900; line-height: .95; letter-spacing: -.03em; text-wrap: balance; }
  .foil .fband { position: absolute; left: -10%; right: -10%; top: 63%; height: 4.5cqi; background: var(--a); transform: rotate(-8deg); }
  .foil .fval { position: absolute; bottom: 19%; left: 0; right: 0; text-align: center; font-size: 7cqi; font-weight: 900; letter-spacing: .02em; }
  .foil .fsub { position: absolute; bottom: 12.5%; left: 0; right: 0; text-align: center; font-size: 4.6cqi; font-weight: 800; letter-spacing: .22em; color: rgba(255,255,255,.55); }

  /* ---------- Home pack tiles ---------- */
  .tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 12px; }
  .hscroll .ptile { width: 100%; }
  .ptile { background: none; border: 0; padding: 0; text-align: left; display: grid; gap: 8px; min-width: 0; }
  .mini { position: relative; aspect-ratio: 1; border-radius: 16px; background: var(--surface); overflow: hidden; }
  .hscroll .mini { aspect-ratio: 1.3; }
  .mini .foil { position: absolute; left: 50%; top: 52%; width: 40%; transform: translate(-50%, -50%) rotate(-4deg); z-index: 2; }
  .hscroll .mini .foil { width: 31%; }
  .mini .gc { position: absolute; width: 54%; top: 34%; }
  .hscroll .mini .gc { width: 42%; top: 30%; }
  .mini .m1 { left: 2%; transform: rotate(-12deg); }
  .mini .m2 { right: 2%; transform: rotate(10deg); }
  .mini .mtag { position: absolute; left: 10px; top: 10px; z-index: 3; background: #fff; font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 99px; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
  .ptile b { display: block; font-size: 15px; font-weight: 800; }
  .ptile small { display: block; color: var(--muted); font-size: 13px; margin-top: 1px; }
  .ptile .row { display: flex; align-items: baseline; gap: 8px; margin-top: 2px; }

  /* ---------- Pack page: showcase + buy panel ---------- */
  .show { position: relative; background: var(--surface); border-radius: 18px; padding: 16px 0 14px; overflow: hidden; }
  .stage { position: relative; height: 210px; touch-action: pan-y; }
  .stage .foil { position: absolute; left: 1%; top: 50%; width: 27%; transform: translateY(-50%) rotate(-7deg); z-index: 1; }
  .slide { position: absolute; left: 50%; top: 50%; width: 60%; z-index: var(--z); opacity: var(--op); filter: brightness(var(--br));
    transform: translate(-50%, -50%) translateX(calc(var(--o) * 52%)) scale(var(--sc)); transition: transform .35s cubic-bezier(.2,.8,.2,1), opacity .35s, filter .35s; }
  .slide .gc { box-shadow: 0 12px 26px rgba(0,0,0,.25); }
  .navb { position: absolute; top: 50%; z-index: 30; width: 38px; height: 38px; margin-top: -19px; border-radius: 50%; border: 0; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.14); display: grid; place-items: center; }
  .navb svg { width: 18px; height: 18px; }
  .navb.l { left: 10px; } .navb.r { right: 10px; }
  .navb:disabled { opacity: .35; }
  .rarline { display: flex; justify-content: center; gap: 6px; margin-top: 12px; }
  .rarline span { font-size: 13px; font-weight: 800; padding: 4px 10px; border-radius: 8px; background: #fff; font-variant-numeric: tabular-nums; }
  .rarline .rn { background: var(--rb); color: var(--rf); }
  .dots { display: flex; justify-content: center; gap: 2px; margin-top: 8px; }
  .dots button { width: 22px; height: 22px; border: 0; background: none; display: grid; place-items: center; padding: 0; }
  .dots button::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #c9c9c9; }
  .dots button[aria-current="true"]::before { background: var(--fg); }
  .buy { margin-top: 14px; border: 1px solid var(--line); border-radius: 18px; padding: 18px; box-shadow: 0 6px 20px rgba(0,0,0,.05); }
  .buy h1 { margin: 0; font-size: 28px; font-weight: 900; letter-spacing: -.01em; text-transform: uppercase; line-height: 1.05; }
  .buy .per { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
  .buy .big { font-size: 34px; font-weight: 900; letter-spacing: -.02em; margin-top: 10px; font-variant-numeric: tabular-nums; }
  .buy .big small { font-size: 14px; font-weight: 700; color: var(--green); margin-left: 8px; letter-spacing: 0; }
  .opt { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; margin-top: 14px; }
  .opt b { font-size: 16px; font-weight: 800; }
  .opt small { display: block; color: var(--muted); font-size: 14px; margin-top: 2px; }
  .tog { width: 52px; height: 32px; border-radius: 99px; border: 0; background: var(--surface-2); position: relative; flex: none; }
  .tog::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.2); transition: transform .2s; }
  .tog[aria-pressed="true"] { background: var(--green); }
  .tog[aria-pressed="true"]::after { transform: translateX(20px); }
  .pay { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
  .pm { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; align-items: center; text-align: left; min-height: 60px; padding: 10px 12px; border-radius: 12px; border: 1.5px solid var(--line); background: #fff; }
  .pm svg { width: 22px; height: 22px; grid-row: span 2; }
  .pm b { font-size: 14px; font-weight: 800; line-height: 1.2; }
  .pm small { font-size: 12px; color: var(--muted); grid-column: 2; }
  .pm[aria-pressed="true"] { border: 2px solid var(--fg); padding: 9.5px 11.5px; }
  .buynow { width: 100%; height: 52px; margin-top: 12px; border-radius: 12px; background: var(--green); font-size: 17px; }
  .buy .fine { text-align: center; color: var(--muted); font-size: 12px; margin: 8px 0 0; }

  /* ---------- Opening: rip the pack ---------- */
  .opener { position: fixed; inset: 0; z-index: 60; color: #fff; background: radial-gradient(circle at 50% 32%, #2c2c2c, #050505 68%);
    display: flex; flex-direction: column; align-items: center; overflow-y: auto; animation: fade .25s both;
    padding: calc(var(--safe-t) + 24px) max(16px, var(--safe-r)) calc(var(--safe-b) + 20px) max(16px, var(--safe-l)); }
  .opener .x { position: fixed; top: calc(var(--safe-t) + 14px); right: max(14px, var(--safe-r)); background: rgba(255,255,255,.14); color: #fff; }
  .ostage { position: relative; width: 300px; height: 420px; flex: none; cursor: pointer; }
  .fw { position: absolute; left: 50%; top: 70px; width: 176px; margin-left: -88px; transition: transform .5s cubic-bezier(.3,.7,.3,1), opacity .5s; }
  .fw.lid { clip-path: inset(0 0 84% 0); z-index: 3; }
  .fw.body { clip-path: inset(16% 0 0 0); z-index: 2; }
  .ostage.ready .fw { animation: nudge 2.4s ease-in-out infinite; }
  @keyframes nudge { 0%, 80%, 100% { transform: none; } 86% { transform: rotate(-2deg); } 93% { transform: rotate(2deg); } }
  .ostage.shake .fw { animation: shake .3s linear; }
  @keyframes shake { 25% { transform: translateX(-4px) rotate(-1.5deg); } 75% { transform: translateX(4px) rotate(1.5deg); } }
  .ostage.torn .fw.lid { transform: translate(70px, -90px) rotate(24deg); opacity: 0; }
  .ostage.dropped .fw.body { transform: translateY(160px); opacity: 0; }
  .tearline { position: absolute; left: 50%; top: 113px; width: 186px; margin-left: -93px; z-index: 4; border-top: 2px dashed rgba(255,255,255,.55); transition: opacity .2s; }
  .ostage.torn .tearline { opacity: 0; }
  .card3 { position: absolute; left: 50%; top: 150px; width: 160px; margin-left: -80px; z-index: 1; perspective: 900px; transition: transform .6s cubic-bezier(.2,.8,.2,1); }
  .ostage.rise .card3 { transform: translateY(-108px); }
  .ostage.center .card3 { transform: translateY(-20px) scale(1.65); z-index: 5; }
  .flip { position: relative; aspect-ratio: 1.586; transform-style: preserve-3d; transition: transform .7s cubic-bezier(.3,.7,.2,1); }
  .ostage.flipped .flip { transform: rotateY(180deg); }
  .face2 { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .face2.front { transform: rotateY(180deg); }
  .cardback { position: absolute; inset: 0; border-radius: 5.5% / 8.7%; background: radial-gradient(circle, #262626, #0a0a0a 70%); box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); display: grid; place-items: center; color: rgba(255,255,255,.8); }
  .cardback svg { width: 22%; height: auto; aspect-ratio: 1; }
  .ohint { margin: 4px 0 0; font-weight: 700; font-size: 15px; color: rgba(255,255,255,.72); min-height: 21px; text-align: center; }
  .ores { width: 100%; max-width: 380px; display: grid; gap: 4px; animation: fade .3s both; margin-top: 6px; }
  .ores .rp { justify-self: start; font-size: 13px; font-weight: 800; padding: 4px 10px; border-radius: 8px; background: var(--rb); color: var(--rf); }
  .ores .eyebrow { color: rgba(255,255,255,.65); }
  .ores h2 { margin: 0; font-size: 28px; font-weight: 900; letter-spacing: -.03em; line-height: 1.1; }
  .ores .sub { color: rgba(255,255,255,.65); font-size: 14px; margin: 0; }
  .ores .vline { margin-top: 10px; display: flex; align-items: baseline; justify-content: space-between; background: rgba(255,255,255,.08); border-radius: 14px; padding: 12px 14px; }
  .ores .vline b { font-size: 26px; font-weight: 900; font-variant-numeric: tabular-nums; }
  .ores .vline s { color: rgba(255,255,255,.5); margin-left: 6px; }
  .ores .vline span { color: rgba(255,255,255,.65); font-size: 13px; font-weight: 600; }
  .ores .sacts .btn.soft { background: rgba(255,255,255,.12); color: #fff; }
  .ores .btn.light { background: #fff; color: var(--fg); }
  .ores .linkbtn { color: #fff; }
  .ores .linkbtn:disabled { color: rgba(255,255,255,.45); }

  /* ---------- Hype: the reveal scales with the tier ---------- */
  .ostage { --tc: #ffffff; }
  .spill { position: absolute; left: 50%; top: 113px; width: 260px; height: 260px; margin: -130px 0 0 -130px; border-radius: 50%; z-index: 0; pointer-events: none;
    background: radial-gradient(circle, var(--tc) 0%, color-mix(in srgb, var(--tc) 35%, transparent) 30%, transparent 66%); opacity: 0; transform: scale(.3); transition: opacity .5s, transform .8s cubic-bezier(.2,.8,.2,1); }
  .ostage.spilling .spill { opacity: .9; transform: scale(1); }
  .ostage.center .spill { opacity: .55; transform: translateY(68px) scale(1.5); }
  .rays { position: absolute; left: 50%; top: 181px; width: 560px; height: 560px; margin: -280px 0 0 -280px; z-index: 0; pointer-events: none; opacity: 0; transition: opacity .7s;
    background: repeating-conic-gradient(from 0deg, color-mix(in srgb, var(--tc) 60%, transparent) 0 5deg, transparent 5deg 16deg);
    -webkit-mask: radial-gradient(circle, #000 12%, transparent 62%); mask: radial-gradient(circle, #000 12%, transparent 62%); animation: turn 16s linear infinite; }
  .ostage.raying .rays { opacity: .75; }
  @keyframes turn { to { transform: rotate(360deg); } }
  .ostage.tease .fw .foil { filter: drop-shadow(0 0 10px var(--tc)) drop-shadow(0 14px 18px rgba(0,0,0,.3)); }
  .ostage.tease2 .fw .foil { filter: drop-shadow(0 0 22px var(--tc)) drop-shadow(0 0 6px var(--tc)); }
  .ostage.shake2 .fw { animation: shake2 .42s linear; }
  @keyframes shake2 { 20% { transform: translateX(-7px) rotate(-3deg); } 40% { transform: translateX(6px) rotate(2.5deg); } 60% { transform: translateX(-6px) rotate(-2deg); } 80% { transform: translateX(5px) rotate(2deg); } }
  .card3 { transition: transform var(--rise, .6s) cubic-bezier(.2,.8,.2,1); }
  .ostage.hit.flipped .front .gc { animation: glow 1.8s ease-in-out .3s infinite; }
  @keyframes glow { 0%, 100% { box-shadow: 0 0 0 1px rgba(255,255,255,.15), 0 0 26px color-mix(in srgb, var(--tc) 60%, transparent); } 50% { box-shadow: 0 0 0 1px rgba(255,255,255,.25), 0 0 60px 6px var(--tc); } }
  .tbanner { position: absolute; left: 0; right: 0; top: 6px; z-index: 6; text-align: center; font-size: 32px; font-weight: 900; letter-spacing: .14em; color: var(--tc);
    text-shadow: 0 0 22px var(--tc), 0 0 2px #000; opacity: 0; transform: scale(.5); transition: opacity .35s, transform .5s cubic-bezier(.2,1.5,.4,1); }
  .ostage.bannered .tbanner { opacity: 1; transform: none; }
  .tbanner small { display: block; font-size: 13px; letter-spacing: .2em; color: rgba(255,255,255,.75); text-shadow: none; margin-top: 2px; }
  .spark { position: absolute; left: 50%; top: 181px; width: 5px; height: 5px; border-radius: 50%; background: var(--tc); box-shadow: 0 0 8px var(--tc); z-index: 4; pointer-events: none;
    animation: burst var(--t) cubic-bezier(.15,.7,.3,1) forwards; }
  @keyframes burst { from { transform: translate(-50%, -50%); opacity: 1; } to { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(.3); opacity: 0; } }
  .mute { position: fixed; top: calc(var(--safe-t) + 14px); left: max(14px, var(--safe-l)); width: 36px; height: 36px; border-radius: 50%; border: 0; background: rgba(255,255,255,.14); color: #fff; display: grid; place-items: center; z-index: 3; }
  .mute svg { width: 18px; height: 18px; }

  /* ---------- Slot reel: the spin between the rip and the reveal ---------- */
  .otitle { margin: 2px 0 0; font-size: 12px; font-weight: 800; letter-spacing: .22em; color: rgba(255,255,255,.55); text-transform: uppercase; }
  .ostage { height: 360px; }
  .ostage.gone { display: none; }
  .oreel { position: relative; width: 100vw; max-width: 600px; height: 200px; margin-top: max(70px, 18vh); flex: none; overflow: hidden; animation: fade .35s both;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 16%, #000 84%, transparent); mask-image: linear-gradient(90deg, transparent, #000 16%, #000 84%, transparent); }
  .omark { position: absolute; left: 50%; top: 4px; bottom: 4px; width: 3px; margin-left: -1.5px; border-radius: 2px; background: #ffc83d; box-shadow: 0 0 16px #ffc83d; z-index: 3; }
  .omark::before, .omark::after { content: ""; position: absolute; left: 50%; margin-left: -8px; border: 8px solid transparent; }
  .omark::before { top: -4px; border-top-color: #ffc83d; }
  .omark::after { bottom: -4px; border-bottom-color: #ffc83d; }
  .ostrip { position: absolute; top: 50%; left: 0; display: flex; gap: 10px; will-change: transform; transform: translate(0, -50%); }
  .rt { flex: none; width: 132px; padding: 8px 8px 10px; border-radius: 14px; --c: #ffffff;
    background: radial-gradient(120% 70% at 50% 105%, color-mix(in srgb, var(--c) 42%, transparent), transparent 70%), #151515;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); transition: transform .35s cubic-bezier(.2,1.3,.4,1), opacity .35s, box-shadow .35s; }
  .rt .tl { display: block; margin-top: 8px; text-align: center; font-size: 10px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--c); }
  .oreel.landed .rt { opacity: .3; }
  .oreel.landed .rt.won { opacity: 1; transform: scale(1.12); box-shadow: inset 0 0 0 2px var(--c), 0 0 34px var(--c); }
  .oreveal { position: relative; width: 300px; height: 300px; flex: none; display: grid; place-items: center; margin-top: 18px; --tc: #fff; }
  .oreveal .rays, .oreveal .spark { top: 150px; }
  .oreveal .spill { top: 150px; opacity: .5; transform: scale(1.3); }
  .oreveal .tbanner { top: 0; }
  .bigcard { position: relative; z-index: 2; width: 250px; }
  .bigcard.popped { animation: bigpop .55s cubic-bezier(.2,1.4,.4,1) both; }
  @keyframes bigpop { from { transform: scale(.55); opacity: 0; } }
  .oreveal.hit .bigcard .gc { animation: glow 1.8s ease-in-out .3s infinite; }
  .oreveal.raying .rays { opacity: .75; }
  .oreveal.bannered .tbanner { opacity: 1; transform: none; }
  .oreveal .bigcard .gc { box-shadow: 0 18px 40px rgba(0,0,0,.5); }

  /* ---------- Test-mode strip ---------- */
  .testbar { flex: none; background: #fff6d6; color: #6b4e00; text-align: center; font-size: 11px; font-weight: 800; letter-spacing: .08em; padding: calc(var(--safe-t) + 4px) 12px 4px; }
  #strip:not(:empty) + .top { padding-top: 8px; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--surface); font-weight: 800; font-size: 15px; display: grid; place-items: center; flex: none; }

  /* ---------- Welcome and sign-in ---------- */
  .auth { min-height: 100%; display: flex; flex-direction: column; padding-top: 10px; }
  .auth .hero { position: relative; height: min(46vh, 380px); display: grid; place-items: center; }
  .auth .hero .foil { width: min(46%, 190px); transform: rotate(-5deg); z-index: 2; }
  .auth .hero .gc { position: absolute; width: min(50%, 210px); top: 30%; }
  .auth .hero .g1 { left: 2%; transform: rotate(-14deg); } .auth .hero .g2 { right: 2%; transform: rotate(12deg); }
  .auth h1 { margin: 8px 0 0; font-size: 34px; font-weight: 900; letter-spacing: -.035em; line-height: 1.02; text-align: center; }
  .auth .lede { margin: 8px auto 0; color: var(--muted); text-align: center; max-width: 30ch; }
  .authbtns { display: grid; gap: 10px; margin-top: 22px; }
  .authbtns .btn { height: 52px; width: 100%; border-radius: 14px; }
  .btn.apple { background: #000; }
  .btn.google { background: #fff; color: var(--fg); box-shadow: inset 0 0 0 1.5px var(--line); }
  .btn svg { width: 20px; height: 20px; }
  .authnote { color: var(--muted); font-size: 12px; text-align: center; margin: 14px 0 4px; line-height: 1.5; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface); border-radius: 12px; padding: 4px; margin-top: 18px; }
  .seg button { border: 0; background: none; height: 40px; border-radius: 9px; font-weight: 800; font-size: 15px; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: #fff; color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .field { display: grid; gap: 6px; margin-top: 14px; }
  .field label { font-size: 14px; font-weight: 700; }
  .field input { height: 50px; border-radius: 12px; border: 1.5px solid var(--line); padding: 0 14px; font-size: 16px; background: #fff; outline: 0; }
  .field input:focus { border-color: var(--fg); }
  .formerr { color: #c0262d; font-size: 14px; font-weight: 600; min-height: 20px; margin: 10px 0 0; }

  /* ---------- Wallet balance + deposit ---------- */
  .balcard { margin-top: 14px; border-radius: 18px; padding: 18px; color: #fff; background: radial-gradient(120% 90% at 0% 0%, #2e2e2e 0%, #121212 50%, #060606 100%); box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
  .balcard small { display: block; color: rgba(255,255,255,.6); font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
  .balcard b { display: block; font-size: 38px; font-weight: 900; letter-spacing: -.02em; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .balcard .row { display: flex; gap: 8px; margin-top: 14px; }
  .balcard .btn { height: 44px; flex: 1; }
  .wseg { margin-top: 18px; }
  .txrow { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .txrow .ti { width: 40px; height: 40px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; }

  .txrow b { display: block; font-weight: 700; font-size: 15px; }
  .txrow small { color: var(--muted); font-size: 13px; }
  .txrow .amt { font-weight: 800; font-variant-numeric: tabular-nums; }

  .amts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 14px; }

  .amts button[aria-pressed="true"] { border: 2px solid var(--fg); }
  .paybtns { display: grid; gap: 8px; margin-top: 16px; }
  .paybtns .btn { height: 52px; border-radius: 12px; width: 100%; }
  .paybtns .btn.cardsoon { background: var(--surface); color: var(--muted); }
  .paysheet { text-align: center; }
  .paysheet .merchant { display: flex; align-items: center; gap: 12px; text-align: left; padding: 12px; background: var(--surface); border-radius: 14px; margin-top: 12px; }
  .paysheet .merchant svg { width: 34px; height: 34px; }
  .paysheet .merchant b { display: block; font-size: 15px; }
  .paysheet .merchant small { color: var(--muted); font-size: 13px; }
  .paysheet .total { display: flex; justify-content: space-between; padding: 14px 4px; border-bottom: 1px solid var(--line); font-size: 16px; }
  .paysheet .total b { font-size: 20px; font-variant-numeric: tabular-nums; }
  .paysheet .ok { width: 64px; height: 64px; border-radius: 50%; background: var(--green); color: #fff; display: grid; place-items: center; margin: 18px auto 8px; animation: bigpop .4s cubic-bezier(.2,1.4,.4,1) both; }
  .paysheet .ok svg { width: 32px; height: 32px; }
  .spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--surface-2); border-top-color: var(--fg); margin: 20px auto 8px; animation: turn .8s linear infinite; }

  /* ---------- Opener: the pack takes most of the screen ---------- */
  .opener .topbtns { position: fixed; top: calc(var(--safe-t) + 14px); left: 50%; transform: translateX(-50%); z-index: 3; }
  .fastbtn { height: 36px; padding: 0 14px; border-radius: 99px; border: 0; background: rgba(255,255,255,.14); color: #fff; font-weight: 800; font-size: 13px; }
  .fastbtn[aria-pressed="true"] { background: #ffc83d; color: #191919; }
  .ostage { width: 300px; height: 404px; transform-origin: top center; transform: scale(var(--k, 1)); margin-bottom: calc((var(--k, 1) - 1) * 404px); }
  .fw { top: 20px; width: 240px; margin-left: -120px; }
  .tearline { top: 78px; width: 252px; margin-left: -126px; }
  .spill { top: 78px; }
  .otitle { margin-top: 44px; }
  .rt { width: 150px; }
  .oreel { height: 220px; }
  .bigcard { width: min(82vw, 320px); }
  .oreveal { width: min(92vw, 360px); height: 330px; }
  .oreveal .rays, .oreveal .spark, .oreveal .spill { top: 165px; }

  /* ---------- Wallet ---------- */
  .pagehead h1 { margin: 4px 0 0; font-size: 30px; font-weight: 900; letter-spacing: -.03em; }
  .pagehead p { color: var(--muted); margin: 4px 0 0; font-size: 15px; }
  .wrow { width: 100%; display: grid; grid-template-columns: 76px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 0; background: none; border: 0; border-bottom: 1px solid var(--line); text-align: left; }
  .wrow b { display: block; font-weight: 700; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wrow small { color: var(--muted); font-size: 14px; }
  .wrow .r { font-weight: 800; font-size: 16px; font-variant-numeric: tabular-nums; }
  .empty { margin-top: 18px; background: var(--surface); border-radius: 16px; padding: 30px 16px; text-align: center; display: grid; justify-items: center; gap: 8px; }

/* ---------- Pieces ---------- */
// Crimped top and bottom edge for the foil pack.
const ZIG = (() => { const n = 18, d = 2.2, top = [], bot = []; for (let i = 0; i <= n; i++) { const x = (i / n * 100).toFixed(2); top.push(`${x}% ${i % 2 ? d : 0}%`); bot.unshift(`${x}% ${i % 2 ? 100 - d : 100}%`); } return `polygon(${top.concat(bot).join(",")})`; })();
const RARITY = [["Base", "#ececec", "#191919"], ["Upgrade", "#e3f5ea", "#0a7a41"], ["Big hit", "#e5eeff", "#1d56c4"], ["Jackpot", "#fbefc4", "#8a5d00"]];
const band = p => `linear-gradient(90deg, ${p.spots.slice(0, 5).map(accent).join(", ")})`;
// The sealed pack: black foil, crimped edges, the pack name and its guarantee.
const foil = p => `<div class="foil"><div class="bag" style="clip-path:${ZIG};--a:${band(p)}"><span class="crimp t"></span><span class="crimp b"></span>
  <span class="fmark"><svg aria-hidden="true"><use href="#hat-w"/></svg>CHEF PACK</span><span class="fname">${esc(p.name)}</span><span class="fband"></span>
  <span class="fval">${p.free ? "FREE PICK" : `${money(p.tiers[0])}+ CARD`}</span><span class="fsub">${p.free ? "NO CARD INSIDE" : "1 GIFT CARD"}</span></div></div>`;
const tile = p => `<button class="ptile" type="button" data-pack="${p.id}">
  <div class="mini">${p.free ? `<span class="mtag">Daily</span>` : p.tag ? `<span class="mtag">${esc(p.tag)}</span>` : ""}${gc(p.spots[0], "m1")}${gc(p.spots[1], "m2")}${foil(p)}</div>
  <span><b>${esc(p.name)}</b><small>${p.free ? "A place to eat tonight" : `1 gift card · ${p.spots.length} restaurants`}</small>
  <span class="row"><strong>${p.free ? "Free" : money(p.price)}</strong>${p.free ? "" : `<em>${money(p.tiers[0])}+ card</em>`}</span></span></button>`;
const openPack = id => go("pack", { packId: id, from: S.page, slide: 3 });

function bindAuth() {
  if (S.auth === "start") {
    $("aApple").onclick = () => signIn({ name: "Apple user", email: "apple-user@test.chefpack", via: "apple" });

// Simulated wallet payment sheet: confirm, processing, done. Real version: payment provider on Tyler's backend.

  return p.tiers.map((v, i) => ({ s: p.spots[(i * 3) % p.spots.length], value: v, label: RARITY[i][0], odds: `${ODDS[i]}%`, r: i }));
}

function setSlide(i) {
  const p = packOf(S.packId), sl = slides(p);
  S.slide = Math.max(0, Math.min(sl.length - 1, i));
  document.querySelectorAll("#stage .slide").forEach(el => {
    const o = +el.dataset.i - S.slide, a = Math.abs(o);
    el.style.setProperty("--o", o); el.style.setProperty("--sc", a ? .8 : 1); el.style.setProperty("--z", 20 - a);
    el.style.setProperty("--op", a > 1 ? 0 : 1); el.style.setProperty("--br", a ? .7 : 1);
  });
  const x = sl[S.slide], rr = RARITY[x.r ?? 0];
  $("rarline").innerHTML = p.free ? `<span>${esc(x.s.n)}</span>` : `<span class="rn" style="--rb:${rr[1]};--rf:${rr[2]}">${x.label}</span><span>${x.odds}</span>`;
  document.querySelectorAll("#dots [data-dot]").forEach(d => d.setAttribute("aria-current", +d.dataset.dot === S.slide));
  $("prev").disabled = S.slide === 0; $("next").disabled = S.slide === sl.length - 1;
}

/* ---------- Sound and haptics (only after the viewer taps; muted by the speaker button) ---------- */
const TIER_COLOR = ["#ffffff", "#2fd27a", "#4f8dff", "#ffc83d"];
let AC = null;
function audio() { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === "suspended") AC.resume(); return AC; } catch (e) { return null; } }
function sfx(kind, tier = 0, dur = 1) {
  if (S.muted) return; const a = audio(); if (!a) return; const now = a.currentTime;
  try {
    if (kind === "rip") {
      const len = Math.floor(a.sampleRate * .28), buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
      const src = a.createBufferSource(), bp = a.createBiquadFilter(), g = a.createGain();
      src.buffer = buf; bp.type = "bandpass"; bp.frequency.setValueAtTime(900, now); bp.frequency.exponentialRampToValueAtTime(3200, now + .25); g.gain.value = .5;
      src.connect(bp).connect(g).connect(a.destination); src.start(now);
    } else if (kind === "rise") {
      const o = a.createOscillator(), lp = a.createBiquadFilter(), g = a.createGain();
      o.type = "sawtooth"; o.frequency.setValueAtTime(110, now); o.frequency.exponentialRampToValueAtTime(110 * (2 + tier), now + dur);
      lp.type = "lowpass"; lp.frequency.setValueAtTime(400, now); lp.frequency.exponentialRampToValueAtTime(3000, now + dur);
      g.gain.setValueAtTime(0, now); g.gain.linearRampToValueAtTime(.06, now + dur * .8); g.gain.linearRampToValueAtTime(0, now + dur);
      o.connect(lp).connect(g).connect(a.destination); o.start(now); o.stop(now + dur + .05);
    } else if (kind === "tick") {
      const o = a.createOscillator(), g = a.createGain();
      o.type = "square"; o.frequency.value = 1700; g.gain.setValueAtTime(.035, now); g.gain.exponentialRampToValueAtTime(.0001, now + .03);
      o.connect(g).connect(a.destination); o.start(now); o.stop(now + .035);
    } else if (kind === "chime") {
      const notes = [[784], [523, 659, 784], [523, 659, 784, 1047], [523, 659, 784, 1047, 1319, 1568]][tier];
      notes.forEach((hz, i) => { const o = a.createOscillator(), g = a.createGain(), t0 = now + i * .085;
        o.type = "triangle"; o.frequency.value = hz; g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(tier ? .16 : .08, t0 + .01); g.gain.exponentialRampToValueAtTime(.0001, t0 + .7);
        o.connect(g).connect(a.destination); o.start(t0); o.stop(t0 + .75); });
    }
  } catch (e) {}
}
const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };
function countUp(els, from, to, ms) {
  const t0 = performance.now(), ease = x => 1 - Math.pow(1 - x, 3);
  const tick = now => { const k = Math.min(1, (now - t0) / ms), v = from + (to - from) * ease(k); els.forEach(el => el && (el.textContent = money(k < 1 ? Math.floor(v) : to))); if (k < 1) requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
}
function sparks(host, n) {
  for (let i = 0; i < n; i++) {
    const sp = document.createElement("i"); sp.className = "spark";
    const ang = Math.random() * Math.PI * 2, d = 90 + Math.random() * 170;
    sp.style.setProperty("--dx", Math.cos(ang) * d + "px"); sp.style.setProperty("--dy", Math.sin(ang) * d + "px");
    sp.style.setProperty("--t", .9 + Math.random() * .9 + "s"); sp.style.animationDelay = Math.random() * .25 + "s";
    host.appendChild(sp); setTimeout(() => sp.remove(), 2200);
  }
}

/* ---------- Open a pack: rip it like a sports pack ---------- */
function buy() {
  const p = packOf(S.packId); if (busy) return;
  if (p.free) return openFlow("free");
  const total = (p.price + FEE + (S.pass ? SWAP : 0));
  if (S.pm === "applepay") return walletPay("Apple Pay", Math.round(total * 100), `${p.name} pack`, () => openFlow("Apple Pay"));
  if (S.balance < total) return deposit(Math.max(25, [25, 50, 100, 250].find(a => a >= total - S.balance) || 250), () => { const y = $("view").scrollTop; render(); $("view").scrollTop = y; });
  openFlow("wallet");
}
function openFlow(method) {
  if (busy) return;
  const p = packOf(S.packId), cost = p.price + FEE + (S.pass ? SWAP : 0);
  if (!p.free && method === "wallet" && S.balance < cost) return;
  busy = true;
  if (!p.free && method === "wallet") { S.balance = Math.round((S.balance - cost) * 100) / 100; $("balAmt").textContent = money(S.balance, true); }
  if (!p.free) addTx("pack", `${p.name} pack`, -Math.round(cost * 100), method === "wallet" ? "Wallet" : method);
  // DEMO MODE: the browser draws the tier and restaurant. In API mode this comes from POST /api/orders and the reel only plays it back.
  const s = rand(p.spots), t = p.free ? 0 : drawTier();
  const res = { p, s, t, value: p.free ? null : p.tiers[t], free: !!p.free, swapped: false, pass: !p.free && S.pass };
  if (!p.free) { res.code = code(); S.wallet.unshift({ id: s.id, value: res.value, t, code: res.code }); save(); }
  const tier = t, tname = ["Base", "Upgrade", "Big hit", "Jackpot"][tier];
  closeSheet();
  const o = document.createElement("div");
  o.className = "opener"; o.setAttribute("role", "dialog"); o.setAttribute("aria-modal", "true"); o.setAttribute("aria-label", "Open your pack");
  o.innerHTML = `<button class="mute" id="mute" type="button" aria-label="${S.muted ? "Turn sound on" : "Mute sound"}">${icon(S.muted ? "muted" : "sound")}</button><span class="topbtns"><button class="fastbtn" id="fastSpin" type="button" aria-pressed="${S.fastSpin}">Fast spin</button></span><button class="x" type="button" aria-label="Close" hidden>${icon("close")}</button>
    <p class="otitle">${esc(p.name)}</p>
    <div class="ostage ready" id="ostage" role="button" tabindex="0" aria-label="Rip the pack open">
      <span class="spill" aria-hidden="true"></span>
      <div class="fw body">${foil(p)}</div><div class="fw lid">${foil(p)}</div><span class="tearline"></span>
    </div>
    <div class="oreel" id="oreel" hidden aria-hidden="true"><span class="omark"></span><div class="ostrip" id="ostrip"></div></div>
    <div class="oreveal" id="oreveal" hidden style="--tc:${TIER_COLOR[tier]}">
      <span class="rays" aria-hidden="true"></span><span class="spill" aria-hidden="true"></span>
      ${tier ? `<div class="tbanner" aria-live="polite">${tname.toUpperCase()}<small>${ODDS[tier]}% PULL</small></div>` : ""}
      <div class="bigcard" id="bigcard">${gc(s, "", tier ? p.price : res.value)}</div>
    </div>
    <p class="ohint" id="ohint">Tap or swipe to rip it open</p><div class="ores" id="ores"></div>`;
  document.body.appendChild(o);
  const st = o.querySelector("#ostage"), reel = o.querySelector("#oreel"), strip = o.querySelector("#ostrip"), rv = o.querySelector("#oreveal");
  // The sealed pack fills most of the screen: scale its 300×404 stage to the viewport.
  const fit = () => st.style.setProperty("--k", Math.max(.8, Math.min(innerWidth * .92 / 300, (innerHeight - 170) / 404, 2.2)).toFixed(3));
  fit(); addEventListener("resize", fit);
  o.querySelector("#fastSpin").onclick = e => { e.stopPropagation(); S.fastSpin = !S.fastSpin; e.currentTarget.setAttribute("aria-pressed", S.fastSpin); };
  o.querySelector(".x").onclick = () => { o.remove(); if (S.page === "pack") render(); };
  o.querySelector("#mute").onclick = e => { e.stopPropagation(); S.muted = !S.muted; e.currentTarget.innerHTML = icon(S.muted ? "muted" : "sound"); e.currentTarget.setAttribute("aria-label", S.muted ? "Turn sound on" : "Mute sound"); };
  const fast = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const at = (ms, fn) => setTimeout(fn, fast ? 0 : ms);

  // Reel: filler over-shows upgrades so Jackpots fly past; sometimes one sits right next to the stop.
  const WIN = 46, N = WIN + 7;
  const filler = () => { if (p.free) return 0; const r = Math.random(); return r < .55 ? 0 : r < .8 ? 1 : r < .93 ? 2 : 3; };
  const items = Array.from({ length: N }, (_, i) => i === WIN ? { s, t: tier } : { s: rand(p.spots), t: filler() });
  if (!p.free && tier < 3 && Math.random() < .6) items[WIN + (Math.random() < .5 ? 1 : -1)].t = 3;
  strip.innerHTML = items.map((it, i) => `<div class="rt ${i === WIN ? "win" : ""}" style="--c:${TIER_COLOR[it.t]}">${gc(it.s, "", p.free ? null : p.tiers[it.t])}<span class="tl">${p.free ? esc(it.s.c) : ["Base", "Upgrade", "Big hit", "Jackpot"][it.t]}</span></div>`).join("");

  const spin = () => {
    reel.hidden = false; o.querySelector("#ohint").textContent = "";
    const pitch = strip.firstElementChild.getBoundingClientRect().width + 10, view = reel.clientWidth;
    const target = WIN * pitch + (pitch - 10) / 2 - view / 2 + (Math.random() - .5) * pitch * .6;
    const over = Math.min(26, pitch * .2), D = fast ? 1 : S.fastSpin ? 1900 : 5600, SETTLE = fast ? 1 : S.fastSpin ? 240 : 420;
    let t0 = null, lastIdx = -1, lastTick = 0;
    const place = x => { strip.style.transform = `translate(${-x}px, -50%)`; };
    const frame = now => {
      t0 = t0 ?? now; const e = now - t0;
      let x;
      if (e < D) { const k = e / D; x = (target + over) * (1 - Math.pow(1 - k, 4)); }
      else { const k = Math.min(1, (e - D) / SETTLE); x = target + over * (1 - (1 - Math.pow(1 - k, 3))); }
      place(x);
      const idx = Math.floor((x + view / 2) / pitch);
      if (idx !== lastIdx) { lastIdx = idx; if (now - lastTick > 38) { lastTick = now; sfx("tick"); buzz(4); } }
      if (e < D + SETTLE) requestAnimationFrame(frame); else land();
    };
    requestAnimationFrame(frame);
  };
  const land = () => {
    reel.classList.add("landed"); buzz(tier ? [30, 40, 60] : 20);
    at(tier ? 900 : 600, () => {
      reel.hidden = true; rv.hidden = false;
      rv.querySelector("#bigcard").classList.add("popped");
      sfx("chime", tier);
      if (tier) rv.classList.add("hit", "bannered");
      if (tier >= 2) { rv.classList.add("raying"); sparks(rv, tier === 3 ? 40 : 20); }
      at(450, () => {
        busy = false; o.querySelector(".x").hidden = false; showResult(res, o);
        if (tier) countUp([o.querySelector(".ores .vline b"), o.querySelector("#bigcard .gbot b")], p.price, res.value, 900 + tier * 250);
      });
    });
  };
  let done = false, x0 = null;
  const rip = () => {
    if (done) return; done = true;
    audio();
    st.classList.remove("ready"); st.setAttribute("aria-label", "Pack opened"); o.querySelector("#ohint").textContent = "";
    st.classList.add("shake");
    at(300, () => { st.classList.remove("shake"); st.classList.add("torn", "spilling"); sfx("rip"); buzz(30); });
    at(700, () => st.classList.add("dropped"));
    at(1050, () => { st.classList.add("gone"); spin(); });
  };
  st.addEventListener("click", rip);
  st.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); rip(); } });
  st.addEventListener("pointerdown", e => { x0 = e.clientX; });
  st.addEventListener("pointermove", e => { if (x0 !== null && Math.abs(e.clientX - x0) > 40) { x0 = null; rip(); } });
  st.focus({ preventScroll: true });
}

/* ---------- Sheets ---------- */
function closeSheet() { document.querySelectorAll(".scrim").forEach(m => m.remove()); }
function sheet(html, label, closable = true) {
  closeSheet();
  const m = document.createElement("div");
  m.className = "scrim";
  m.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(label)}"><span class="grab" aria-hidden="true"></span>${closable ? `<button class="x" type="button" aria-label="Close">${icon("close")}</button>` : ""}${html}</div>`;
  document.body.appendChild(m);
  m.addEventListener("click", e => { if (e.target === m && !busy) closeSheet(); });
  m.querySelector(".x")?.addEventListener("click", closeSheet);
  return m;
}
function showResult(r, o) {
  const { p, s } = r, up = r.t > 0, rr = RARITY[r.t];
  const paid = r.free ? PACKS.find(q => q.spots.includes(s)) : null;
  const swapLabel = r.swapped ? "Swap used" : r.pass ? "Use your Swap Pass: swap restaurant" : `Not feeling it? Swap restaurant for ${money(SWAP)}`;
  o.querySelector("#ores").innerHTML = `
    ${r.free ? "" : `<span class="rp" style="--rb:${rr[1]};--rf:${rr[2]}">${rr[0]}${up ? ` · ${ODDS[r.t]}%` : ""}</span>`}
    <p class="eyebrow">${r.free ? "How about tonight at" : r.swapped ? "Swapped, same value" : "Tonight you're eating at"}</p>
    <h2>${esc(s.n)}</h2><p class="sub">${esc(s.c)} · ${CITY}</p>
    ${r.free ? "" : `<div class="vline"><span><b>${money(r.value)}</b>${up ? `<s>${money(p.price)}</s>` : ""}</span><span>Gift card · in your wallet</span></div>`}
    <div class="sacts">${r.free
      ? `<button class="btn light" id="sPaid" type="button" style="grid-column:1/-1">Get a card · ${esc(paid.name)} ${money(paid.price)}</button><button class="btn soft" id="sAgain" type="button">Pick again</button><a class="btn soft" href="${maps(s.n)}" target="_blank" rel="noopener">Directions</a>`
      : `<a class="btn light" href="${maps(s.n)}" target="_blank" rel="noopener">Directions</a><button class="btn soft" id="sCard" type="button">Show card</button><button class="btn soft" id="sMore" type="button" style="grid-column:1/-1">Open another</button>`}</div>
    ${r.free ? "" : `<button class="linkbtn" id="sSwap" type="button" ${r.swapped || p.spots.length < 2 ? "disabled" : ""}>${swapLabel}</button>`}`;
  const q = id => o.querySelector("#" + id);
  const close = () => { o.remove(); };
  if (q("sCard")) q("sCard").onclick = () => { close(); showCard(0); };
  if (q("sMore")) q("sMore").onclick = () => { close(); render(); };
  if (q("sPaid")) q("sPaid").onclick = () => { close(); go("pack", { packId: paid.id, from: "home", slide: 3 }); };
  if (q("sAgain")) q("sAgain").onclick = () => { close(); openFlow("free"); };
  if (q("sSwap") && !q("sSwap").disabled) q("sSwap").onclick = () => {
    if (!r.pass) { if (S.balance < SWAP) { q("sSwap").textContent = "Add funds to swap"; return; } S.balance = Math.round((S.balance - SWAP) * 100) / 100; addTx("swap", "Swap restaurant", -SWAP * 100, "Wallet"); $("balAmt").textContent = money(S.balance, true); }
    r.s = rand(p.spots.filter(x => x !== s)); r.swapped = true; S.wallet[0].id = r.s.id; save();
    const bc = o.querySelector("#bigcard"); bc.innerHTML = gc(r.s, "", r.value); bc.classList.remove("popped"); void bc.offsetWidth; bc.classList.add("popped"); sfx("chime", 0); showResult(r, o);
  };
}
function showCard(i) {
  const w = S.wallet[i], s = R[w.id];
  let seed = [...w.code].reduce((a, ch) => (a * 31 + ch.charCodeAt(0)) >>> 0, 7), bars = "";
  for (let k = 0; k < 52; k++) { seed = (seed * 1103515245 + 12345) >>> 0; bars += `<i style="flex:${1 + (seed >>> 16) % 3} 0 0"></i><span style="flex:${1 + (seed >>> 20) % 2} 0 0"></span>`; }
  sheet(`<div class="slot">${gc(s, "", w.value)}</div>
    <div class="result"><p class="eyebrow">Gift card${w.t ? " · upgraded" : ""}</p><h2>${esc(s.n)}</h2>
      <div class="valuebox"><span><b>${money(w.value)}</b></span><span>Show at the register</span></div>
      <div class="barcode" aria-label="Barcode">${bars}</div><div class="code">${w.code}</div>
      <p class="sub" style="text-align:center;margin-top:6px">Demo code, not redeemable.</p>
      <div class="sacts"><a class="btn" href="${maps(s.n)}" target="_blank" rel="noopener" style="grid-column:1/-1">Directions</a></div></div>`, s.n + " gift card");
}
function showBrand(s) {
  const packs = PACKS.filter(p => p.spots.includes(s));
  const m = sheet(`<div class="slot">${gc(s)}</div>
    <div class="result"><h2>${esc(s.n)}</h2><p class="sub">${esc(s.c)} · cards from ${money(s.min)} to ${money(s.max)}</p>
      <p class="eyebrow" style="margin-top:14px">In ${packs.length} pack${packs.length === 1 ? "" : "s"}</p>
      <div class="inpacks">${packs.map(p => `<button type="button" data-pack="${p.id}">${esc(p.name)}<span>${money(p.price)} · 1 in ${p.spots.length}</span></button>`).join("")}</div></div>`, s.n);
  m.querySelectorAll("[data-pack]").forEach(b => b.onclick = () => go("pack", { packId: b.dataset.pack, from: "cards" }));
}

/* ---------- Bindings ---------- */
const bind = {
  home() {
    $("pOpen").onclick = () => openPack("quick");
    if ($("hDep")) $("hDep").onclick = () => deposit();
    $("view").querySelectorAll("[data-cat]").forEach(b => b.onclick = () => { S.cat = S.cat === b.dataset.cat ? "all" : b.dataset.cat; $("view").querySelectorAll("[data-cat]").forEach(c => c.setAttribute("aria-pressed", c.dataset.cat === S.cat)); renderPacks(); });
    renderPacks();
  },
  pack() {
    setSlide(S.slide);
    $("prev").onclick = () => setSlide(S.slide - 1); $("next").onclick = () => setSlide(S.slide + 1);
    document.querySelectorAll("#dots [data-dot]").forEach(d => d.onclick = () => setSlide(+d.dataset.dot));
    let x0 = null; const st = $("stage");
    st.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, { passive: true });
    st.addEventListener("touchend", e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 40) setSlide(S.slide + (dx < 0 ? 1 : -1)); x0 = null; });
    if ($("pass")) $("pass").onclick = () => { S.pass = !S.pass; const y = $("view").scrollTop; render(); $("view").scrollTop = y; };
    document.querySelectorAll("[data-pm]").forEach(b => b.onclick = () => { S.pm = b.dataset.pm; const y = $("view").scrollTop; render(); $("view").scrollTop = y; });
    $("open").onclick = buy;
  },
  cards() { renderShelf(); },
  wallet() {
    $("wDep").onclick = () => deposit();
    document.querySelectorAll("[data-wt]").forEach(b => b.onclick = () => { S.wtab = b.dataset.wt; render(); });
    if ($("toHome")) $("toHome").onclick = () => go("home");
    $("view").querySelectorAll("[data-i]").forEach(b => b.onclick = () => showCard(+b.dataset.i));
  }
};

function start(data) {
  S = Object.assign(fresh(), (data && data.S) || load() || {});
  if (!packOf(S.packId)) S.packId = "quick";
  if (!({ home: 1, pack: 1, cards: 1, wallet: 1 })[S.page]) S.page = "home";
  if (S.user && !S.tx) S.tx = [];
  busy = false;
  $("view").addEventListener("scroll", () => $("top").classList.toggle("shadow", $("view").scrollTop > 4), { passive: true });
  addEventListener("keydown", e => { if (e.key === "Escape" && !busy) { closeSheet(); document.querySelector(".opener")?.remove(); } });
  render();
}
window.claude?.hot?.snapshot?.(() => ({ S }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
