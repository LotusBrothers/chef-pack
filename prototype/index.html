<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>body{margin:0}</style></head><body>
<title>Chef Pack</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&display=swap">
<style>
  /* Layout: a food-delivery-style app. Sticky header (brand, location, search, balance), category rail, promo, card rows;
     a store-style pack page with a reel and a sticky order bar; a bottom sheet for the result; bottom nav on phones.
     World: delivery-app clean. White, black, one green for "guaranteed" and "upgraded", soft food-colored covers. */
  :root {
    color-scheme: light;
    --bg: #ffffff;
    --surface: #f6f6f6;
    --surface-2: #eeeeee;
    --line: #e9e9e9;
    --fg: #000000;
    --muted: #5e5e5e;
    --green: #0a8a4a;
    --green-bg: #e6f5ec;
    --hat: #000000;
    --pleat: #ffffff;
    --font: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --r: 16px;
  }
  html { background: var(--bg); }
  body { background: var(--bg); color: var(--fg); font: 400 15px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
  * { box-sizing: border-box; }
  button, input { font: inherit; color: inherit; }
  button { -webkit-tap-highlight-color: transparent; cursor: pointer; }
  a { color: inherit; text-decoration: none; }
  img { display: block; }
  :focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; border-radius: 10px; }
  .wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

  /* ---------- Header ---------- */
  header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: rgba(255,255,255,.96); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
  .hd { display: flex; align-items: center; gap: 14px; height: 68px; }
  .brand { display: flex; align-items: center; gap: 8px; background: none; border: 0; padding: 0; flex: none; }
  .brand svg { width: 30px; height: 30px; }
  .brand b { font-size: 20px; font-weight: 900; letter-spacing: -.03em; }
  .pill { display: flex; align-items: center; gap: 6px; background: var(--surface); border: 0; border-radius: 99px; padding: 10px 14px; font-weight: 600; font-size: 14px; white-space: nowrap; }
  .pill svg { width: 16px; height: 16px; flex: none; }
  .search { flex: 1; display: flex; align-items: center; gap: 10px; background: var(--surface); border-radius: 99px; padding: 0 16px; height: 44px; min-width: 0; }
  .search svg { width: 18px; height: 18px; flex: none; color: var(--muted); }
  .search input { border: 0; background: none; outline: 0; width: 100%; font-size: 15px; min-width: 0; }
  .search input::placeholder { color: var(--muted); }
  .bal { display: flex; align-items: center; gap: 8px; background: var(--fg); color: #fff; border: 0; border-radius: 99px; padding: 10px 14px; font-weight: 700; font-size: 14px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .bal svg { width: 16px; height: 16px; }
  .navlinks { display: flex; gap: 2px; }
  .navlinks button { background: none; border: 0; border-radius: 99px; padding: 10px 14px; font-weight: 700; font-size: 14px; color: var(--muted); }
  .navlinks button[aria-current="page"] { color: var(--fg); background: var(--surface); }
  .searchrow { display: none; padding-bottom: 12px; }
  @media (max-width: 860px) {
    .hd .search, .navlinks { display: none; }
    .hd { height: 60px; gap: 8px; }
    .hd .pill { margin-left: auto; }
    .searchrow { display: block; }
  }
  @media (max-width: 380px) { .brand b { display: none; } }

  main { padding-block: 18px 120px; }

  /* ---------- Bottom nav (phones) ---------- */
  .tabbar { display: none; }
  @media (max-width: 860px) {
    .tabbar { display: grid; grid-template-columns: repeat(3, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--bg); border-top: 1px solid var(--line);
      padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
    .tabbar button { background: none; border: 0; display: grid; justify-items: center; gap: 3px; padding: 6px 0; font-size: 11px; font-weight: 700; color: var(--muted); }
    .tabbar button svg { width: 22px; height: 22px; }
    .tabbar button[aria-current="page"] { color: var(--fg); }
  }

  /* ---------- Home ---------- */
  .rail { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 4px 0 6px; margin-inline: -4px; }
  .rail::-webkit-scrollbar { display: none; }
  .cat { flex: none; width: 82px; display: grid; justify-items: center; gap: 6px; background: none; border: 0; padding: 6px 4px; border-radius: 14px; }
  .cat span.ic { width: 62px; height: 62px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; transition: transform .15s, background .15s; }
  .cat img { width: 42px; height: 42px; }
  .cat b { font-size: 13px; font-weight: 600; }
  .cat:hover span.ic { transform: translateY(-2px); }
  .cat[aria-pressed="true"] span.ic { background: var(--fg); }
  .cat[aria-pressed="true"] b { font-weight: 800; }

  .promo { margin-top: 14px; border-radius: 20px; background: var(--fg); color: #fff; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 26px 28px; overflow: hidden; position: relative; min-height: 200px; }
  .promo h1 { margin: 0; font-size: clamp(26px, 3.6vw, 38px); line-height: 1.05; font-weight: 900; letter-spacing: -.03em; text-wrap: balance; max-width: 15ch; }
  .promo p { margin: 10px 0 0; color: #bdbdbd; max-width: 42ch; font-size: 15px; }
  .promo .btns { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
  .promo .art { position: relative; width: 260px; height: 170px; }
  .promo .art img { position: absolute; filter: drop-shadow(0 14px 20px rgba(0,0,0,.45)); animation: bob 5s ease-in-out infinite; }
  .promo .art .a1 { width: 150px; left: 20px; top: 8px; }
  .promo .art .a2 { width: 104px; right: 0; top: 0; animation-delay: .6s; }
  .promo .art .a3 { width: 96px; right: 44px; bottom: -6px; animation-delay: 1.2s; }
  @keyframes bob { 50% { transform: translateY(-8px) rotate(2deg); } }
  @media (max-width: 640px) { .promo { grid-template-columns: minmax(0, 1fr); padding: 22px 20px; } .promo .art { width: 100%; height: 120px; order: -1; } .promo .art .a1 { width: 110px; left: 0; } .promo .art .a2 { width: 80px; right: 30%; } .promo .art .a3 { width: 76px; right: 0; bottom: 0; } }

  .btn { border: 0; border-radius: 99px; padding: 13px 20px; font-weight: 800; font-size: 15px; background: var(--fg); color: #fff; display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; transition: transform .08s, opacity .15s; }
  .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.light { background: #fff; color: var(--fg); }
  .btn.soft { background: var(--surface); color: var(--fg); }
  .btn.ghost-dark { background: rgba(255,255,255,.14); color: #fff; }
  .btn.block { width: 100%; }

  .sh { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin: 30px 0 12px; }
  .sh h2 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
  .sh small { color: var(--muted); font-size: 14px; font-weight: 600; }
  .hscroll { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(260px, 300px); gap: 14px; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px; scroll-snap-type: x mandatory; }
  .hscroll::-webkit-scrollbar { display: none; }
  .hscroll > * { scroll-snap-align: start; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 22px 16px; }

  .card { background: none; border: 0; padding: 0; text-align: left; display: grid; gap: 10px; min-width: 0; }
  .cover { position: relative; aspect-ratio: 16 / 9; border-radius: var(--r); background: var(--bg-c, var(--surface)); overflow: hidden; display: grid; place-items: center; }
  .cover img.hero { width: 44%; filter: drop-shadow(0 12px 16px rgba(0,0,0,.18)); transition: transform .25s; }
  .cover img.side { position: absolute; width: 20%; filter: drop-shadow(0 8px 10px rgba(0,0,0,.15)); opacity: .95; }
  .cover img.s1 { left: 7%; bottom: 10%; transform: rotate(-12deg); }
  .cover img.s2 { right: 7%; top: 10%; transform: rotate(10deg); }
  .card:hover .cover img.hero { transform: scale(1.06) rotate(-3deg); }
  .tagx { position: absolute; top: 10px; left: 10px; background: #fff; color: var(--fg); font-size: 12px; font-weight: 800; padding: 5px 9px; border-radius: 99px; box-shadow: 0 2px 6px rgba(0,0,0,.08); }
  .tagx.g { background: var(--green); color: #fff; }
  .ci { display: flex; justify-content: space-between; align-items: start; gap: 10px; }
  .ci b { display: block; font-size: 16px; font-weight: 800; letter-spacing: -.01em; }
  .ci small { display: block; color: var(--muted); font-size: 14px; margin-top: 1px; }
  .ci .price { flex: none; background: var(--surface); border-radius: 99px; padding: 5px 11px; font-weight: 800; font-size: 14px; font-variant-numeric: tabular-nums; }
  .card.free .ci .price { background: var(--green-bg); color: var(--green); }
  .guar { color: var(--green); font-weight: 700; }
  .none { color: var(--muted); padding: 34px 16px; text-align: center; background: var(--surface); border-radius: var(--r); }

  .steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  @media (max-width: 640px) { .steps { grid-template-columns: minmax(0, 1fr); gap: 8px; } }
  .step { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 12px; align-items: center; background: var(--surface); border-radius: var(--r); padding: 14px; }
  .step .n { width: 48px; height: 48px; border-radius: 50%; background: #fff; display: grid; place-items: center; }
  .step .n img { width: 30px; height: 30px; }
  .step b { display: block; font-size: 15px; font-weight: 800; }
  .step small { color: var(--muted); font-size: 13px; }

  /* ---------- Pack page ---------- */
  .store { max-width: 820px; margin: 0 auto; }
  .scover { position: relative; height: clamp(180px, 30vw, 260px); border-radius: 20px; background: var(--bg-c); overflow: hidden; display: grid; place-items: center; }
  .scover img.hero { width: clamp(130px, 22vw, 190px); filter: drop-shadow(0 18px 22px rgba(0,0,0,.2)); animation: bob 5s ease-in-out infinite; }
  .scover img.side { position: absolute; width: clamp(60px, 9vw, 86px); filter: drop-shadow(0 8px 12px rgba(0,0,0,.15)); }
  .scover img.s1 { left: 9%; bottom: 12%; transform: rotate(-12deg); }
  .scover img.s2 { right: 9%; top: 14%; transform: rotate(10deg); }
  .round { position: absolute; top: 12px; left: 12px; width: 40px; height: 40px; border-radius: 50%; border: 0; background: #fff; display: grid; place-items: center; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
  .round svg { width: 20px; height: 20px; }
  .stitle { margin-top: 16px; }
  .stitle h1 { margin: 0; font-size: clamp(26px, 4vw, 34px); font-weight: 900; letter-spacing: -.03em; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 6px; color: var(--muted); font-size: 14px; }
  .meta b { color: var(--fg); font-weight: 700; }
  .reelbox { margin-top: 18px; background: var(--surface); border-radius: 20px; padding: 14px 0; position: relative; overflow: hidden; }
  .reelbox::before, .reelbox::after { content: ""; position: absolute; top: 0; bottom: 0; width: 70px; z-index: 2; pointer-events: none; }
  .reelbox::before { left: 0; background: linear-gradient(90deg, var(--surface), transparent); }
  .reelbox::after { right: 0; background: linear-gradient(-90deg, var(--surface), transparent); }
  .marker { position: absolute; left: 50%; top: 6px; bottom: 6px; width: 3px; margin-left: -1.5px; background: var(--fg); border-radius: 3px; z-index: 3; }
  .marker::before { content: ""; position: absolute; top: -2px; left: 50%; margin-left: -7px; border: 7px solid transparent; border-top-color: var(--fg); }
  .viewport { overflow: hidden; }
  .strip { display: flex; gap: 10px; will-change: transform; padding: 0 10px; }
  .tile { flex: none; width: 120px; background: #fff; border-radius: 14px; padding: 8px; display: grid; gap: 6px; box-shadow: 0 1px 2px rgba(0,0,0,.05); transition: box-shadow .2s, transform .2s; }
  .tile .th { aspect-ratio: 1; border-radius: 10px; background: var(--bg-c); display: grid; place-items: center; position: relative; }
  .tile .th img { width: 62%; }
  .tile .th .up { position: absolute; top: 5px; right: 5px; background: var(--green); color: #fff; font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 99px; }
  .tile b { font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .tile small { color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: -4px; }
  .tile.hit { box-shadow: 0 0 0 3px var(--fg), 0 10px 24px rgba(0,0,0,.18); transform: translateY(-3px); }
  .odds { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
  .odd { background: var(--surface); border-radius: 14px; padding: 10px 12px; }
  .odd b { display: block; font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .odd small { color: var(--muted); font-size: 12px; }
  .odd.base { background: var(--green-bg); }
  .odd.base small { color: var(--green); font-weight: 700; }
  @media (max-width: 520px) { .odds { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .rows { display: grid; }
  .row { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .thumb { width: 64px; height: 64px; border-radius: 12px; background: var(--bg-c); display: grid; place-items: center; position: relative; overflow: hidden; }
  .thumb img { width: 64%; }
  .thumb svg.lg { position: absolute; left: 5px; bottom: 5px; width: 18px; height: 18px; fill: #000; background: #fff; border-radius: 5px; padding: 2px; }
  .row b { display: block; font-weight: 700; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row small { color: var(--muted); font-size: 14px; }
  .row .r { color: var(--muted); font-size: 13px; font-weight: 600; white-space: nowrap; }
  .orderbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 24; background: var(--bg); border-top: 1px solid var(--line); padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  .orderbar .in { max-width: 820px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; }
  .orderbar .btn { height: 54px; font-size: 16px; }
  .orderbar .btn .sum { margin-left: auto; opacity: .85; font-variant-numeric: tabular-nums; }
  .orderbar .fine { grid-column: 1 / -1; text-align: center; color: var(--muted); font-size: 12px; margin-top: -2px; }
  @media (max-width: 860px) { body.has-order .tabbar { display: none; } }

  /* ---------- Sheet ---------- */
  .scrim { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.45); display: grid; align-items: end; justify-items: center; animation: fade .2s both; }
  @media (min-width: 700px) { .scrim { align-items: center; padding: 20px; } }
  @keyframes fade { from { opacity: 0; } }
  .sheet { width: 100%; max-width: 440px; background: var(--bg); border-radius: 24px 24px 0 0; overflow: hidden; animation: up .35s cubic-bezier(.2,.9,.3,1) both; max-height: 92dvh; overflow-y: auto; padding-bottom: env(safe-area-inset-bottom, 0px); }
  @media (min-width: 700px) { .sheet { border-radius: 24px; } }
  @keyframes up { from { transform: translateY(60px); opacity: 0; } }
  .shero { position: relative; height: 220px; background: var(--bg-c); display: grid; place-items: center; overflow: hidden; }
  .shero img.hero { width: 150px; filter: drop-shadow(0 18px 22px rgba(0,0,0,.22)); animation: pop .6s .1s cubic-bezier(.2,1.4,.4,1) both, bob 5s .8s ease-in-out infinite; }
  @keyframes pop { from { transform: scale(.3) rotate(-20deg); opacity: 0; } }
  .shero .x { position: absolute; top: 12px; right: 12px; width: 36px; height: 36px; border-radius: 50%; border: 0; background: #fff; display: grid; place-items: center; z-index: 3; }
  .shero .x svg { width: 18px; height: 18px; }
  .shero .upg { position: absolute; top: 14px; left: 14px; background: var(--green); color: #fff; font-weight: 800; font-size: 13px; padding: 6px 11px; border-radius: 99px; animation: pop .45s .5s both; }
  .shero svg.lg { position: absolute; left: 16px; bottom: 16px; width: 34px; height: 34px; fill: #000; background: #fff; border-radius: 9px; padding: 5px; }
  .sbody { padding: 18px 20px 20px; display: grid; gap: 4px; }
  .eyebrow { color: var(--muted); font-size: 14px; font-weight: 600; margin: 0; }
  .sbody h2 { margin: 0; font-size: 26px; font-weight: 900; letter-spacing: -.03em; line-height: 1.1; }
  .sbody .sub { color: var(--muted); font-size: 14px; margin: 0; }
  .valuebox { margin-top: 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--surface); border-radius: 14px; padding: 12px 14px; }
  .valuebox b { font-size: 26px; font-weight: 900; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .valuebox s { color: var(--muted); font-size: 15px; margin-left: 6px; }
  .valuebox span { color: var(--muted); font-size: 13px; font-weight: 600; }
  .sacts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
  .sacts .btn { height: 50px; }
  .linkbtn { background: none; border: 0; color: var(--fg); font-weight: 700; font-size: 14px; text-decoration: underline; text-underline-offset: 3px; padding: 12px 0 0; justify-self: center; }
  .linkbtn:disabled { color: var(--muted); text-decoration: none; cursor: default; }
  .barcode { height: 76px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; display: flex; align-items: stretch; margin-top: 12px; }
  .barcode i { background: #000; display: block; }
  .code { text-align: center; font-weight: 700; letter-spacing: .14em; font-size: 15px; margin-top: 8px; user-select: all; font-variant-numeric: tabular-nums; }
  .confetti { position: absolute; top: -12px; width: 8px; height: 12px; border-radius: 2px; animation: fall linear forwards; z-index: 2; }
  @keyframes fall { to { transform: translateY(260px) rotate(540deg); } }

  /* ---------- Wallet ---------- */
  .pagehead h1 { margin: 0; font-size: 30px; font-weight: 900; letter-spacing: -.03em; }
  .pagehead p { color: var(--muted); margin: 4px 0 0; }
  .wrow { width: 100%; background: none; border: 0; text-align: left; }
  .wrow .r { font-size: 16px; color: var(--fg); font-weight: 800; }
  .empty { margin-top: 18px; background: var(--surface); border-radius: 20px; padding: 36px 16px; text-align: center; display: grid; justify-items: center; gap: 8px; }
  .empty img { width: 72px; }
  .empty b { font-size: 18px; font-weight: 800; }
  .empty p { margin: 0; color: var(--muted); }

  footer { color: var(--muted); font-size: 12px; padding-block: 24px; border-top: 1px solid var(--line); margin-top: 40px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="hat" viewBox="0 0 32 32">
      <path style="fill:var(--hat,#000)" d="M9.2 23.2v-6.1a6 6 0 0 1-.6-11.4 7.4 7.4 0 0 1 14.8 0 6 6 0 0 1-.6 11.4v6.1z"/>
      <path style="stroke:var(--pleat,#fff)" stroke-width="1.4" stroke-linecap="round" d="M13 17.6v4.1M16 16.8v4.9M19 17.6v4.1" fill="none"/>
      <rect style="fill:var(--hat,#000)" x="9.2" y="24.4" width="13.6" height="3.4" rx="1.2"/>
    </symbol>
    <symbol id="pin" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></symbol>
    <symbol id="search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="wallet" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="3" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M16 12.5h2" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>

function save() { try { localStorage.setItem("chefpack.app.v1", JSON.stringify({ wallet: S.wallet, balance: S.balance })); } catch (e) {} }
function load() { try { const s = JSON.parse(localStorage.getItem("chefpack.app.v1")); return s && Array.isArray(s.wallet) ? s : null; } catch (e) { return null; } }
function drawTier() { let r = Math.random() * 100; for (let i = 0; i < ODDS.length; i++) if ((r -= ODDS[i]) < 0) return i; return 0; }

/* ---------- Router ---------- */
function go(page, extra = {}) { if (busy) return; Object.assign(S, { page }, extra); render(); window.scrollTo(0, 0); }
function render() {
  closeSheet();
  $("balAmt").textContent = money(S.balance, true);
  const cur = S.page === "pack" && S.packId === "free" ? "free" : S.page === "pack" ? "home" : S.page;
  document.querySelectorAll("[data-go]").forEach(b => b.setAttribute("aria-current", b.dataset.go === cur ? "page" : "false"));
  document.body.classList.toggle("has-order", S.page === "pack");
  $("view").innerHTML = ({ home, pack, wallet })[S.page]();
  bind[S.page]?.();
}

/* ---------- Pieces ---------- */
const cover = (p, big = false) => `<div class="${big ? "scover" : "cover"}" style="--bg-c:${BG[p.food]}">${img(p.side[0], "side s1")}${img(p.side[1], "side s2")}${img(p.food, "hero")}${big ? "" : (p.free ? `<span class="tagx g">Free</span>` : p.tag ? `<span class="tagx">${p.tag}</span>` : "")}</div>`;
const card = p => `<button class="card ${p.free ? "free" : ""}" type="button" data-pack="${p.id}">${cover(p)}
  <div class="ci"><div><b>${p.name}</b><small>${p.free ? "A place to eat, no card" : `<span class="guar">${money(p.price)}+ card</span> · ${p.spots.length} restaurants`}</small></div><span class="price">${p.free ? "Free" : money(p.price)}</span></div></button>`;
const thumb = s => `<div class="thumb" style="--bg-c:${BG[s.f]}">${img(s.f)}${mark(s)}</div>`;

/* ---------- Pages ---------- */
function home() {
  return `
    <div class="rail" role="group" aria-label="Categories">${CATS.map(([id, label, f]) => `<button class="cat" type="button" data-cat="${id}" aria-pressed="${S.cat === id}"><span class="ic">${img(f)}</span><b>${label}</b></button>`).join("")}</div>
    <section class="promo">
      <div>
        <h1>Can't decide on dinner?</h1>
        <p>Rip a pack and we'll pick the restaurant. Every gift card is worth at least what you paid.</p>
        <div class="btns"><button class="btn light" id="pOpen" type="button">Open a $15 pack</button><button class="btn ghost-dark" id="pFree" type="button">Free spin</button></div>
      </div>
      <div class="art" aria-hidden="true">${img("burger", "a1")}${img("pizza", "a2")}${img("taco", "a3")}</div>
    </section>
    <div id="results"></div>`;
}
function renderResults() {
  const q = S.q.trim().toLowerCase();
  const list = ALL.filter(p => (S.cat === "all" || p.cats.includes(S.cat)) && (!q || p.name.toLowerCase().includes(q) || p.spots.some(s => s.n.toLowerCase().includes(q))));
  const browsing = S.cat === "all" && !q;
  $("results").innerHTML = browsing ? `
    <div class="sh"><h2>Popular in Rogers</h2><small>${PACKS.length} packs</small></div>
    <div class="hscroll">${["quick", "sitdown", "local", "pizza", "steak"].map(id => card(packOf(id))).join("")}</div>
    <div class="sh"><h2>How it works</h2></div>
    <div class="steps">
      <div class="step"><span class="n">${img("dump")}</span><span><b>Pick a pack</b><small>Fast food, sit-down, local or fancy</small></span></div>
      <div class="step"><span class="n">${img("pizza")}</span><span><b>Spin the reel</b><small>It lands on tonight's restaurant</small></span></div>
      <div class="step"><span class="n">${img("burger")}</span><span><b>Go eat</b><small>Your gift card is in your wallet</small></span></div>
    </div>
    <div class="sh"><h2>All packs</h2></div>
    <div class="cards">${ALL.map(card).join("")}</div>`
  : `<div class="sh"><h2>${q ? `Results for "${S.q.trim().replace(/</g, "&lt;")}"` : CATS.find(c => c[0] === S.cat)[1]}</h2><small>${list.length} pack${list.length === 1 ? "" : "s"}</small></div>
     ${list.length ? `<div class="cards">${list.map(card).join("")}</div>` : `<div class="none">No packs match. Try another restaurant or category.</div>`}`;
  $("results").querySelectorAll("[data-pack]").forEach(b => b.onclick = () => go("pack", { packId: b.dataset.pack }));
}

function tile(p, s, t, win = false) {
  return `<div class="tile ${win ? "wintile" : ""}"><div class="th" style="--bg-c:${BG[s.f]}">${img(s.f)}${t ? `<span class="up">Upgrade</span>` : ""}</div>${p.free ? `<b style="font-size:13px">${s.c}</b>` : `<b>${money(p.tiers[t])}</b>`}<small>${s.n}</small></div>`;
}
const filler = p => { const r = Math.random(); return p.free ? 0 : r < .62 ? 0 : r < .86 ? 1 : r < .96 ? 2 : 3; };
function pack() {
  const p = packOf(S.packId), total = p.price + FEE;
  return `<div class="store">
    <div style="position:relative">${cover(p, true)}<button class="round" id="back" type="button" aria-label="Back">${icon("back")}</button></div>
    <div class="stitle"><h1>${p.name}</h1>
      <div class="meta">${p.free ? `<span><b>Free</b> · once a day</span><span>${p.spots.length} restaurants in ${CITY}</span>`
        : `<span class="guar">${money(p.price)}+ gift card, guaranteed</span><span><b>${p.spots.length}</b> restaurants</span><span><b>${upOdds()}%</b> upgrade chance</span>`}</div></div>
    <div class="reelbox"><div class="marker"></div><div class="viewport"><div class="strip" id="strip">${Array.from({ length: 10 }, () => tile(p, rand(p.spots), filler(p))).join("")}</div></div></div>
    ${p.free ? "" : `<div class="odds">${p.tiers.map((v, i) => `<div class="odd ${i ? "" : "base"}"><b>${money(v)}</b><small>${i ? `${ODDS[i]}% chance` : "Guaranteed"}</small></div>`).join("")}</div>`}
    <div class="sh"><h2>${p.free ? "Could land on" : "What's inside"}</h2><small>Equal chance each</small></div>
    <div class="rows">${p.spots.map(s => `<div class="row">${thumb(s)}<span style="min-width:0"><b>${s.n}</b><small>${s.c}</small></span><span class="r">${p.free ? "" : `1 in ${p.spots.length}`}</span></div>`).join("")}</div>
  </div>
  <div class="orderbar"><div class="in">
    <button class="btn block" id="open" type="button">${p.free ? "Spin for dinner" : `Open pack<span class="sum">${money(total, true)}</span>`}</button>
    ${p.free ? "" : `<button class="btn soft" id="demo" type="button">Try free</button>`}
    <span class="fine">${p.free ? "Free spins suggest a place. A pack gets you the gift card." : `${money(p.price)} pack + ${money(FEE, true)} service fee · Demo, no real charge`}</span>
  </div></div>`;
}

function wallet() {
  return `<div class="pagehead"><h1>Wallet</h1><p>${S.wallet.length ? `${S.wallet.length} gift card${S.wallet.length === 1 ? "" : "s"} · ${money(S.wallet.reduce((a, w) => a + w.value, 0))} total` : "Your gift cards show up here."}</p></div>
    ${S.wallet.length ? `<div class="rows" style="margin-top:10px">${S.wallet.map((w, i) => { const s = R[w.id]; return `<button class="row wrow" type="button" data-i="${i}">${thumb(s)}<span style="min-width:0"><b>${s.n}</b><small>${w.t ? "Upgraded · " : ""}${s.c}</small></span><span class="r">${money(w.value)}</span></button>`; }).join("")}</div>`
      : `<div class="empty">${img("dump")}<b>No gift cards yet</b><p>Open a pack and your card lands here, ready to scan.</p><button class="btn" id="toHome" type="button" style="margin-top:8px">Browse packs</button></div>`}`;
}

/* ---------- Spin ---------- */
function spin(demo) {
  if (busy) return;
  const p = packOf(S.packId), cost = p.price + FEE;
  if (!p.free && !demo && S.balance < cost) { $("open").textContent = "Not enough credit. Tap your balance to add $100."; return; }
  busy = true;
  if (!p.free && !demo) { S.balance -= cost; $("balAmt").textContent = money(S.balance, true); }
  const s = rand(p.spots), t = p.free ? 0 : drawTier();
  const strip = $("strip"), view = strip.parentElement;
  const tiles = [];
  for (let i = 0; i < WIN_AT + 5; i++) tiles.push(i === WIN_AT ? tile(p, s, t, true) : tile(p, rand(p.spots), filler(p)));
  strip.style.transition = "none"; strip.style.transform = "translateX(0)";
  strip.innerHTML = tiles.join("");
  strip.offsetWidth;
  const tw = strip.firstElementChild.getBoundingClientRect().width + 10;
  const x = 10 + WIN_AT * tw + (tw - 10) / 2 - view.clientWidth / 2 + (Math.random() - .5) * tw * .55;
  strip.style.transition = "transform 4.6s cubic-bezier(.08,.6,.12,1)";
  strip.style.transform = `translateX(-${x}px)`;
  document.querySelectorAll("#open, #demo").forEach(b => b.disabled = true);
  setTimeout(() => {
    strip.querySelector(".wintile").classList.add("hit");
    setTimeout(() => {
      busy = false;
      document.querySelectorAll("#open, #demo").forEach(b => b.disabled = false);
      const res = { p, s, t, value: p.free ? 0 : p.tiers[t], demo, free: !!p.free, swapped: false };
      if (!p.free && !demo) { res.code = code(); S.wallet.unshift({ id: s.id, value: res.value, t, code: res.code }); save(); }
      showResult(res);
    }, 450);
  }, 4650);
}

/* ---------- Sheets ---------- */
function closeSheet() { document.querySelectorAll(".scrim").forEach(m => m.remove()); }
function sheet(html, label, bg) {
  closeSheet();
  const m = document.createElement("div");
  m.className = "scrim"; m.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${label}" style="--bg-c:${bg}">${html}</div>`;
  document.body.appendChild(m);
  m.addEventListener("click", e => { if (e.target === m) closeSheet(); });
  m.querySelector(".x")?.addEventListener("click", closeSheet);
  return m;
}
function showResult(r) {
  const { p, s } = r, up = r.t > 0;
  const paid = r.free ? PACKS.find(q => q.spots.includes(s)) : null;
  const m = sheet(`
    <div class="shero">${up ? `<span class="upg">Upgraded!</span>` : ""}<button class="x" type="button" aria-label="Close">${icon("close")}</button>${img(s.f, "hero")}${mark(s)}</div>
    <div class="sbody">
      <p class="eyebrow">${r.demo ? "Demo spin · not saved" : r.free ? "How about tonight at" : r.swapped ? "Swapped · same value" : "Tonight you're eating at"}</p>
      <h2>${s.n}</h2><p class="sub">${s.c} · ${CITY}</p>
      ${r.free ? "" : `<div class="valuebox"><span><b>${money(r.value)}</b>${up ? `<s>${money(p.price)}</s>` : ""}</span><span>Gift card</span></div>`}
      <div class="sacts">
        ${r.free ? `<button class="btn" id="sPaid" type="button" style="grid-column:1/-1">Get it paid for · ${paid.name} ${money(paid.price)}</button><button class="btn soft" id="sAgain" type="button">Spin again</button><a class="btn soft" href="${maps(s.n)}" target="_blank" rel="noopener">Directions</a>`
        : r.demo ? `<button class="btn" id="sReal" type="button" style="grid-column:1/-1">Open for real · ${money(p.price + FEE, true)}</button>`
        : `<a class="btn" href="${maps(s.n)}" target="_blank" rel="noopener">Directions</a><button class="btn soft" id="sCard" type="button">Show card</button>`}
      </div>
      ${r.free || r.demo ? "" : `<button class="linkbtn" id="sSwap" type="button" ${r.swapped || p.spots.length < 2 ? "disabled" : ""}>${r.swapped ? "Swap used" : `Not feeling it? Swap restaurant for ${money(SWAP)}`}</button>`}
    </div>`, s.n, BG[s.f]);
  const q = id => m.querySelector("#" + id);
  if (q("sCard")) q("sCard").onclick = () => showCard(0);
  if (q("sPaid")) q("sPaid").onclick = () => go("pack", { packId: paid.id });
  if (q("sAgain")) q("sAgain").onclick = () => { closeSheet(); spin(false); };
  if (q("sReal")) q("sReal").onclick = () => { closeSheet(); spin(false); };
  if (q("sSwap") && !q("sSwap").disabled) q("sSwap").onclick = () => {
    r.s = rand(p.spots.filter(x => x !== s)); r.swapped = true;
    S.wallet[0].id = r.s.id; save(); showResult(r);
  };
  if (up) confetti(m.querySelector(".shero"), r.t >= 2 ? 70 : 36);
}
function showCard(i) {
  const w = S.wallet[i], s = R[w.id];
  let seed = [...w.code].reduce((a, ch) => (a * 31 + ch.charCodeAt(0)) >>> 0, 7), bars = "";
  for (let k = 0; k < 52; k++) { seed = (seed * 1103515245 + 12345) >>> 0; bars += `<i style="flex:${1 + (seed >>> 16) % 3} 0 0"></i><span style="flex:${1 + (seed >>> 20) % 2} 0 0"></span>`; }
  sheet(`
    <div class="shero" style="height:160px"><button class="x" type="button" aria-label="Close">${icon("close")}</button>${img(s.f, "hero")}${mark(s)}</div>
    <div class="sbody">
      <p class="eyebrow">Gift card${w.t ? " · upgraded" : ""}</p><h2>${s.n}</h2>
      <div class="valuebox"><span><b>${money(w.value)}</b></span><span>Show at the register</span></div>
      <div class="barcode" aria-label="Barcode">${bars}</div><div class="code">${w.code}</div>
      <p class="sub" style="text-align:center;margin-top:6px">Demo code, not redeemable.</p>
      <div class="sacts"><a class="btn" href="${maps(s.n)}" target="_blank" rel="noopener" style="grid-column:1/-1">Directions</a></div>
    </div>`, s.n + " gift card", BG[s.f]);
}
function confetti(host, n) {
  const cols = ["#000", "#0a8a4a", "#f4b63f", "#e5352b", "#ffffff"];
  for (let i = 0; i < n; i++) {
    const c = document.createElement("i"); c.className = "confetti";
    c.style.left = Math.random() * 100 + "%"; c.style.background = cols[i % cols.length];
    c.style.animationDuration = 1.2 + Math.random() * 1.4 + "s"; c.style.animationDelay = Math.random() * .4 + "s";
    host.appendChild(c); setTimeout(() => c.remove(), 3200);
  }
}

/* ---------- Bindings ---------- */
const bind = {
  home() {
    $("pOpen").onclick = () => go("pack", { packId: "quick" });
    $("pFree").onclick = () => go("pack", { packId: "free" });
    $("view").querySelectorAll("[data-cat]").forEach(b => b.onclick = () => { S.cat = S.cat === b.dataset.cat ? "all" : b.dataset.cat; $("view").querySelectorAll("[data-cat]").forEach(c => c.setAttribute("aria-pressed", c.dataset.cat === S.cat)); renderResults(); });
    renderResults();
  },
  pack() {
    $("back").onclick = () => go("home");
    $("open").onclick = () => spin(false);
    if ($("demo")) $("demo").onclick = () => spin(true);
  },
  wallet() {
    if ($("toHome")) $("toHome").onclick = () => go("home");
    $("view").querySelectorAll("[data-i]").forEach(b => b.onclick = () => showCard(+b.dataset.i));
  }
};

function start(data) {
  S = Object.assign(fresh(), (data && data.S) || load() || {});
  busy = false;
  document.querySelectorAll("[data-go]").forEach(b => b.onclick = () => b.dataset.go === "free" ? go("pack", { packId: "free" }) : go(b.dataset.go));
  $("brand").onclick = () => go("home", { cat: "all", q: "" });
  $("bal").onclick = () => { S.balance += 100; save(); $("balAmt").textContent = money(S.balance, true); };
  ["q1", "q2"].forEach(id => $(id).addEventListener("input", e => {
    S.q = e.target.value; ["q1", "q2"].forEach(o => { if (o !== id) $(o).value = S.q; });
    if (S.page !== "home") { go("home"); $(id).focus(); } else renderResults();
  }));
  addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
  render();
}
window.claude?.hot?.snapshot?.(() => ({ S }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
</body></html>
