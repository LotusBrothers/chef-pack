<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Chef Pack">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>body{margin:0}
</style>
</head>
<body>
<title>Chef Pack</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
  /* Layout: a mobile app shell (100dvh column, max 480px): fixed top bar, one scrolling content area, fixed tab bar or order bar.
     System: iOS-native type (SF Pro on Apple devices, Inter elsewhere), black and white with one gold accent,
     8pt spacing, 14px controls, 20px cards. Gift cards are the product; everything around them stays quiet. */
  :root {
    color-scheme: light;
    --bg: #ffffff;
    --desk: #f2f2f4;
    --surface: #f4f4f6;
    --surface-2: #e9e9ed;
    --line: rgba(0,0,0,.08);
    --fg: #0b0b0c;
    --fg-2: #3a3a3c;
    --muted: #6e6e73;
    --faint: #a1a1a6;
    --ink: #0d0d0f;
    --gold: #d9b25f;
    --ok: #1a7f45;
    --ok-bg: #e9f6ef;
    --green: var(--ok);
    --green-bg: var(--ok-bg);
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, "Segoe UI", Roboto, sans-serif;
    --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", system-ui, "Segoe UI", Roboto, sans-serif;
    --ease: cubic-bezier(.2,.8,.2,1);
    --shadow-1: 0 1px 2px rgba(0,0,0,.05), 0 1px 1px rgba(0,0,0,.03);
    --shadow-2: 0 10px 30px rgba(0,0,0,.10), 0 2px 8px rgba(0,0,0,.05);
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
    --gutter: 16px;
  }
  html, body { height: 100%; }
  html { background: var(--desk); }
  body { background: var(--desk); color: var(--fg); font: 400 16px/1.4 var(--font); letter-spacing: -.011em; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    -webkit-text-size-adjust: 100%; overflow: hidden; overscroll-behavior: none; touch-action: manipulation; font-feature-settings: "cv11", "ss01"; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  button, input { font: inherit; color: inherit; letter-spacing: inherit; }
  button { cursor: pointer; -webkit-user-select: none; user-select: none; }
  a { color: inherit; text-decoration: none; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; border-radius: 10px; }
  .num, .bal, .price { font-variant-numeric: tabular-nums; }

  /* ---------- Shell ---------- */
  .app { position: relative; height: 100%; max-width: 480px; margin: 0 auto; background: var(--bg); display: flex; flex-direction: column; overflow: hidden; }
  @media (min-width: 520px) { .app { box-shadow: 0 0 0 1px var(--line), 0 30px 80px rgba(0,0,0,.08); } }
  .scroll { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain; scrollbar-width: none;
    padding: 4px max(var(--gutter), var(--safe-r)) 32px max(var(--gutter), var(--safe-l)); }
  .scroll::-webkit-scrollbar { display: none; }
  .top { flex: none; background: var(--bg); padding: var(--safe-t) max(var(--gutter), var(--safe-r)) 10px max(var(--gutter), var(--safe-l)); z-index: 5; transition: box-shadow .2s; }
  .top.shadow { box-shadow: 0 1px 0 var(--line); }
  .bar { display: flex; align-items: center; gap: 8px; min-height: 48px; }
  .brand { display: flex; align-items: center; gap: 9px; background: none; border: 0; padding: 0; min-height: 44px; flex: none; }
  .brand svg { width: 30px; height: 30px; }
  .brand b { font: 700 18px/1 var(--display); letter-spacing: -.03em; }
  .authlogo { display: block; width: 60px; height: 60px; margin: 6px auto 16px; filter: drop-shadow(0 8px 18px rgba(0,0,0,.18)); }
  .grow { flex: 1; min-width: 0; }
  .pill { display: inline-flex; align-items: center; gap: 4px; background: none; border: 0; padding: 0 6px; height: 36px; font-weight: 600; font-size: 13px; color: var(--muted); white-space: nowrap; }
  .pill svg { width: 14px; height: 14px; flex: none; }
  .bal { display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: var(--surface); color: var(--fg); border: 0; border-radius: 99px; padding: 0 14px; height: 36px; font-weight: 600; font-size: 14px; white-space: nowrap; transition: transform .15s var(--ease); }
  .bal svg { width: 15px; height: 15px; }
  .bal.me { width: 36px; padding: 0; background: var(--fg); color: #fff; font-weight: 700; font-size: 15px; text-transform: uppercase; }
  .round { width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--surface); display: grid; place-items: center; flex: none; }
  .round svg { width: 19px; height: 19px; }
  .bartitle { flex: 1; min-width: 0; text-align: center; font-weight: 600; font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .search { display: flex; align-items: center; gap: 10px; background: var(--surface); border-radius: 12px; padding: 0 14px; height: 44px; margin-top: 6px; transition: box-shadow .15s; }
  .search:focus-within { box-shadow: inset 0 0 0 1.5px var(--fg); }
  .search svg { width: 17px; height: 17px; flex: none; color: var(--muted); }
  /* 16px input text stops iOS Safari from zooming in on focus. */
  .search input { border: 0; background: none; outline: 0; width: 100%; font-size: 16px; min-width: 0; -webkit-appearance: none; appearance: none; }
  .search input::placeholder { color: var(--faint); }
  .search input::-webkit-search-cancel-button { -webkit-appearance: none; }
  .tabbar { flex: none; display: grid; grid-template-columns: repeat(3, 1fr); background: rgba(255,255,255,.92); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
    border-top: .5px solid rgba(0,0,0,.12); padding: 2px max(8px, var(--safe-r)) max(6px, var(--safe-b)) max(8px, var(--safe-l)); z-index: 5; }
  .tabbar button { background: none; border: 0; display: grid; justify-items: center; align-content: center; gap: 3px; min-height: 50px; font-size: 10.5px; font-weight: 600; letter-spacing: 0; color: #9a9aa0; position: relative; }
  .tabbar button svg { width: 24px; height: 24px; }
  .tabbar button[aria-current="page"] { color: var(--fg); }
  .tabbar .dot { position: absolute; top: 3px; left: calc(50% + 7px); min-width: 17px; height: 17px; border-radius: 9px; background: #e5484d; color: #fff; font-size: 10.5px; font-weight: 700; line-height: 17px; padding: 0 5px; }
  .orderbar { flex: none; background: rgba(255,255,255,.94); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-top: .5px solid rgba(0,0,0,.12);
    padding: 10px max(var(--gutter), var(--safe-r)) max(10px, var(--safe-b)) max(var(--gutter), var(--safe-l)); z-index: 5; display: grid; gap: 6px; }
  .orderbar .btn { height: 54px; font-size: 17px; width: 100%; margin: 0; }
  .orderbar .fine { text-align: center; color: var(--muted); font-size: 12px; margin: 0; }
  .in-fade { animation: fade .22s var(--ease) both; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } }

  /* ---------- Shared ---------- */
  .btn { border: 0; border-radius: 14px; padding: 0 20px; min-height: 50px; font-weight: 600; font-size: 16px; letter-spacing: -.01em; background: var(--fg); color: #fff;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; transition: transform .15s var(--ease), opacity .15s, background .15s; }
  .btn:active, .bal:active, .chip:active, .ptile:active, .item:active, .wrow:active, .feature .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .45; cursor: default; transform: none; }
  .btn.soft { background: var(--surface); color: var(--fg); }
  .btn.white { background: #fff; color: var(--fg); }
  .sh { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin: 30px 0 12px; }
  .sh h2 { margin: 0; font: 700 21px/1.2 var(--display); letter-spacing: -.025em; }
  .sh small { color: var(--muted); font-size: 13px; font-weight: 500; white-space: nowrap; }
  .guar { color: var(--ok); font-weight: 600; }

  /* ---------- Gift card: one premium black card for every brand ---------- */
  .gc { position: relative; aspect-ratio: 1.586; border-radius: 5.5% / 8.7%; container-type: inline-size; overflow: hidden; color: #fff;
    background:
      radial-gradient(140% 100% at 0% 0%, rgba(255,255,255,.10) 0%, transparent 45%),
      linear-gradient(160deg, #1d1d20 0%, #0c0c0d 55%, #050505 100%);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.09), inset 0 1px 0 rgba(255,255,255,.12); }
  .gc::after { content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,.06) 48%, transparent 60%); pointer-events: none; }
  .gc .gtop { position: absolute; left: 7%; top: 10%; display: flex; align-items: center; gap: 2cqi; font-size: 4.8cqi; font-weight: 600; letter-spacing: .01em; color: rgba(255,255,255,.62); }
  .gc .gtop svg { width: 5.6cqi; height: 5.6cqi; }
  .gc .gmark { position: absolute; inset: 24% 8% 28%; display: grid; place-items: center; text-align: center; }
  .gc .gmark .gn { font-family: var(--display); font-weight: 700; letter-spacing: -.025em; line-height: 1.04; text-wrap: balance; }
  .gc .gmark svg { height: 100%; max-width: 70%; fill: #fff; }
  .gc .gbot { position: absolute; left: 7%; right: 7%; bottom: 10%; display: flex; justify-content: space-between; align-items: baseline; }
  .gc .gbot span { font-size: 4.4cqi; font-weight: 500; letter-spacing: .01em; color: rgba(255,255,255,.45); }
  .gc .gbot b { font-family: var(--display); font-size: 9.5cqi; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .gc .acc { position: absolute; left: 7%; width: 14%; bottom: 0; height: 1.4cqi; border-radius: 1cqi 1cqi 0 0; background: var(--a); }
  .gc .gimg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .gc.settle { animation: settle .35s cubic-bezier(.2,1.3,.4,1) both; }
  @keyframes settle { from { transform: scale(.94); } }
  @container (max-width: 130px) { .gc .gtop, .gc .gbot span { display: none; } .gc .gmark { inset: 14% 8% 18%; } }

  /* ---------- Home ---------- */
  .chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 6px calc(-1 * var(--gutter)) 0; padding: 0 var(--gutter); }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; height: 34px; padding: 0 14px; border-radius: 99px; border: 1px solid var(--line); background: #fff; font-weight: 600; font-size: 14px; color: var(--fg-2); transition: background .15s, color .15s, transform .15s var(--ease); }
  .chip[aria-pressed="true"] { background: var(--fg); border-color: var(--fg); color: #fff; }
  .feature { position: relative; margin-top: 16px; border-radius: 22px; overflow: hidden; color: #fff; isolation: isolate;
    background: radial-gradient(80% 90% at 85% 40%, #2b2a28 0%, #141415 55%, #0a0a0b 100%);
    display: grid; grid-template-columns: minmax(0, 1fr) 40%; gap: 8px; align-items: center; padding: 22px 8px 22px 20px; min-height: 230px; box-shadow: var(--shadow-2); }
  .feature::before { content: ""; position: absolute; right: -10%; top: 50%; width: 70%; aspect-ratio: 1; transform: translateY(-50%); border-radius: 50%; z-index: -1;
    background: radial-gradient(circle, rgba(217,178,95,.30), transparent 62%); }
  .feature .kicker { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--gold); letter-spacing: .06em; text-transform: uppercase; }
  .feature h1 { margin: 8px 0 8px; font: 700 27px/1.06 var(--display); letter-spacing: -.035em; }
  .feature p { margin: 0 0 18px; color: rgba(255,255,255,.64); font-size: 14.5px; line-height: 1.4; }
  .feature .btn { min-height: 42px; height: 42px; border-radius: 99px; font-size: 14.5px; padding: 0 18px; }
  .fart { position: relative; align-self: stretch; min-height: 180px; }
  .fart .foil { position: absolute; left: 50%; top: 50%; width: 76%; transform: translate(-50%, -50%) rotate(7deg); filter: drop-shadow(0 18px 24px rgba(0,0,0,.55)); }

  .hscroll { display: grid; grid-auto-flow: column; grid-auto-columns: 44%; gap: 12px; overflow-x: auto; scrollbar-width: none; margin: 0 calc(-1 * var(--gutter)); padding: 0 var(--gutter) 4px; scroll-snap-type: x mandatory; scroll-padding-left: var(--gutter); }
  .hscroll::-webkit-scrollbar { display: none; }
  .hscroll > * { scroll-snap-align: start; }
  .tag { display: inline-block; vertical-align: 2px; margin-left: 4px; background: var(--surface); color: var(--fg); font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 99px; }
  .none { color: var(--muted); padding: 28px 16px; text-align: center; background: var(--surface); border-radius: 16px; font-size: 15px; }

  /* ---------- Gift card shelf ---------- */
  .shelf { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 12px; }
  .item { background: none; border: 0; padding: 0; text-align: left; display: grid; gap: 4px; min-width: 0; transition: transform .15s var(--ease); }
  .item .gc { margin-bottom: 6px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.09), 0 6px 14px rgba(0,0,0,.12); }
  .item span { font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; order: 1; }
  .item b { font-size: 13px; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; order: 2; }
  .item small { font-size: 13px; color: var(--muted); order: 2; }

  /* ---------- Pack screen ---------- */
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .values { margin-top: 4px; background: var(--surface); border-radius: 16px; overflow: hidden; }
  .values div { display: flex; justify-content: space-between; gap: 12px; padding: 14px 16px; font-size: 15px; position: relative; }
  .values div + div::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: 1px solid var(--line); }
  .values b { font-weight: 500; font-variant-numeric: tabular-nums; }
  .values span { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }

  /* ---------- Sheet ---------- */
  .scrim { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.36); display: flex; align-items: flex-end; justify-content: center; animation: scrimin .2s both; touch-action: none; }
  @keyframes scrimin { from { opacity: 0; } }
  .sheet { position: relative; width: 100%; max-width: 480px; background: var(--bg); border-radius: 26px 26px 0 0; animation: up .38s cubic-bezier(.16,1,.3,1) both; max-height: calc(100% - var(--safe-t) - 24px); overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y;
    padding: 24px 20px max(20px, var(--safe-b)); box-shadow: 0 -10px 40px rgba(0,0,0,.12); }
  @keyframes up { from { transform: translateY(100%); } }
  .grab { width: 36px; height: 5px; border-radius: 3px; background: #d4d4d8; position: absolute; top: 8px; left: 50%; margin-left: -18px; }
  .x { position: absolute; top: 14px; right: 14px; width: 32px; height: 32px; border-radius: 50%; border: 0; background: var(--surface); color: var(--muted); display: grid; place-items: center; z-index: 3; }
  .x svg { width: 15px; height: 15px; }
  .slot { width: 76%; margin: 18px auto 0; }
  .slot .gc { box-shadow: inset 0 0 0 1px rgba(255,255,255,.09), 0 20px 40px rgba(0,0,0,.28); }
  .status { text-align: center; margin-top: 16px; color: var(--muted); font-weight: 500; font-size: 15px; min-height: 21px; }
  .status:empty { display: none; }
  .result { display: grid; gap: 4px; margin-top: 18px; animation: fade .25s both; }
  .eyebrow { color: var(--muted); font-size: 13px; font-weight: 500; margin: 0; }
  .result h2 { margin: 0; font: 700 26px/1.12 var(--display); letter-spacing: -.03em; }
  .result .sub { color: var(--muted); font-size: 14px; margin: 0; line-height: 1.45; }
  .upg { justify-self: start; background: var(--ok); color: #fff; font-weight: 600; font-size: 13px; padding: 4px 10px; border-radius: 99px; margin-bottom: 4px; }
  .valuebox { margin-top: 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--surface); border-radius: 14px; padding: 14px 16px; }
  .valuebox b { font: 700 26px/1 var(--display); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .valuebox s { color: var(--muted); font-size: 15px; margin-left: 6px; }
  .valuebox span { color: var(--muted); font-size: 13px; font-weight: 500; }
  .sacts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
  .sacts .btn { min-height: 52px; }
  .linkbtn { background: none; border: 0; color: var(--fg); font-weight: 600; font-size: 15px; text-decoration: underline; text-underline-offset: 3px; min-height: 44px; justify-self: center; }
  .linkbtn:disabled { color: var(--muted); text-decoration: none; cursor: default; }
  .barcode { height: 76px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; display: flex; align-items: stretch; margin-top: 12px; }
  .barcode i { background: #000; display: block; }
  .code { text-align: center; font-weight: 600; letter-spacing: .14em; font-size: 15px; margin-top: 8px; user-select: all; font-variant-numeric: tabular-nums; }
  .inpacks { display: grid; margin-top: 8px; background: var(--surface); border-radius: 16px; overflow: hidden; }
  .inpacks button { display: flex; justify-content: space-between; align-items: center; min-height: 52px; padding: 0 16px; border: 0; background: none; font-weight: 500; font-size: 15px; text-align: left; position: relative; }
  .inpacks button + button::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: 1px solid var(--line); }
  .inpacks span { color: var(--muted); font-weight: 500; font-size: 14px; }

  /* ---------- Foil pack: the sealed pack you rip open ---------- */
  .foil { position: relative; width: 100%; aspect-ratio: .66; container-type: inline-size; filter: drop-shadow(0 14px 18px rgba(0,0,0,.32)); }
  .foil .bag { position: absolute; inset: 0; overflow: hidden; color: #fff;
    background:
      linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.07) 22%, rgba(255,255,255,0) 40%, rgba(255,255,255,.05) 70%, rgba(255,255,255,0) 100%),
      linear-gradient(180deg, #1c1c1f 0%, #0d0d0e 60%, #070708 100%); }
  .foil .bag::before { content: ""; position: absolute; inset: 0; background: linear-gradient(118deg, transparent 34%, rgba(255,255,255,.13) 47%, transparent 58%); }
  .foil .crimp { position: absolute; left: 0; right: 0; height: 5.5%; background: repeating-linear-gradient(90deg, rgba(255,255,255,.10) 0 .8cqi, rgba(0,0,0,.35) .8cqi 1.6cqi); }
  .foil .crimp.t { top: 0; } .foil .crimp.b { bottom: 0; }
  .foil .fmark { position: absolute; top: 21%; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 2cqi; font-size: 5cqi; font-weight: 600; letter-spacing: .16em; color: rgba(255,255,255,.62); }
  .foil .fmark svg { width: 7.5cqi; height: 7.5cqi; }
  .foil .fname { position: absolute; top: 34%; left: 8%; right: 8%; text-align: center; font: 700 15cqi/.95 var(--display); letter-spacing: -.045em; text-wrap: balance; }
  .foil .fband { position: absolute; left: 30%; right: 30%; top: 62%; height: 1.4cqi; border-radius: 1cqi; background: var(--a); }
  .foil .fval { position: absolute; bottom: 19%; left: 0; right: 0; text-align: center; font: 700 7cqi/1 var(--display); letter-spacing: -.01em; }
  .foil .fsub { position: absolute; bottom: 12%; left: 0; right: 0; text-align: center; font-size: 4.2cqi; font-weight: 600; letter-spacing: .14em; color: rgba(255,255,255,.45); }

  /* ---------- Home pack tiles ---------- */
  .tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 12px; }
  .hscroll .ptile { width: 100%; }
  .ptile { background: none; border: 0; padding: 0; text-align: left; display: grid; gap: 10px; min-width: 0; transition: transform .15s var(--ease); }
  .mini { position: relative; aspect-ratio: 1; border-radius: 20px; overflow: hidden; isolation: isolate;
    background: radial-gradient(75% 65% at 50% 42%, color-mix(in srgb, var(--a, #888) 30%, #1d1d20) 0%, #0f0f11 72%); }
  .mini .foil { position: absolute; left: 50%; top: 54%; width: 46%; transform: translate(-50%, -50%) rotate(-5deg); z-index: 2; transition: transform .3s var(--ease); }
  .ptile:hover .mini .foil { transform: translate(-50%, -52%) rotate(-3deg); }
  .mini .mtag { position: absolute; left: 10px; top: 10px; z-index: 3; background: rgba(255,255,255,.14); color: #fff; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); font-size: 11px; font-weight: 600; padding: 4px 9px; border-radius: 99px; }
  .mini .mtag.test { background: rgba(245,184,74,.18); color: #f5c26b; }
  .ptile b { display: block; font-size: 16px; font-weight: 600; letter-spacing: -.015em; }
  .ptile small { display: block; color: var(--muted); font-size: 13px; margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ptile .row { display: flex; align-items: baseline; gap: 6px; margin-top: 3px; }

/* ---------- Swipe to open ---------- */
.swipe{position:relative;height:62px;border-radius:99px;overflow:hidden;user-select:none;-webkit-user-select:none;
  background:linear-gradient(180deg,#0c8243,#086f37);box-shadow:0 10px 24px rgba(8,111,55,.26),inset 0 1px 0 rgba(255,255,255,.2)}
.swipe-fill{position:absolute;left:0;top:0;bottom:0;width:72px;border-radius:inherit;background:linear-gradient(90deg,rgba(255,255,255,.08),rgba(255,255,255,.22));transition:width .35s var(--ease)}
.swipe-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:8px;padding-left:46px;color:#fff;font-size:16.5px;font-weight:650;letter-spacing:-.01em;pointer-events:none;transition:opacity .35s var(--ease)}

.swipe-label>span{background:linear-gradient(90deg,#fff 0 40%,#bff5d6 50%,#fff 60% 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:swipeShine 2.6s linear infinite}
@keyframes swipeShine{from{background-position:100% 0}to{background-position:-150% 0}}
.swipe-knob{position:absolute;left:5px;top:5px;width:52px;height:52px;border-radius:50%;border:0;padding:0;background:#fff;color:#0a7a3e;display:grid;place-items:center;
  box-shadow:0 3px 10px rgba(0,0,0,.2);cursor:grab;touch-action:none;transition:transform .35s var(--ease)}
.swipe-knob svg{width:24px;height:24px}
.swipe.dragging .swipe-knob,.swipe.dragging .swipe-fill,.swipe.dragging .swipe-label{transition:none}.swipe.dragging .swipe-knob{cursor:grabbing}
.swipe.opened .swipe-knob,.swipe.opened .swipe-fill{transition:transform .2s ease-out,width .2s ease-out}
.swipe.nudge .swipe-knob{animation:swipeNudge .7s var(--ease)}
@keyframes swipeNudge{35%{transform:translateX(34px)}65%{transform:translateX(-3px)}100%{transform:none}}
.swipe-knob:focus-visible{outline:3px solid #fff;outline-offset:-6px;box-shadow:0 0 0 3px #0a7a3e,0 3px 10px rgba(0,0,0,.2)}
.swipe[data-disabled]{background:var(--surface-2);box-shadow:none}.swipe[data-disabled] .swipe-label>span{animation:none;background:none;color:var(--muted)}
.swipe[data-disabled] .swipe-label small{color:var(--faint)}.swipe[data-disabled] .swipe-knob{color:var(--faint);cursor:default;box-shadow:none}.swipe[data-disabled] .swipe-fill{display:none}

// Parse a fetch or throw a Fail with status 0 for timeouts and lost connections.
async function call(url, opts = {}, ms = 15000) {
  let r;
  try { r = await fetch(url, { ...opts, signal: AbortSignal.timeout(ms) }); }
  catch (e) { throw new Fail(0, e.name === "TimeoutError" ? "timeout" : navigator.onLine === false ? "offline" : "network"); }
  let body = null; try { body = await r.json(); } catch (e) {}

}

/* ---------- Auth: Supabase Auth over fetch (no client library added) ---------- */
let keyCache = AUTH_KEY;

  if (!keyCache) throw new Fail(503, "auth_not_configured", "Sign-in isn't configured on this deployment yet (missing Supabase publishable key).");
  return keyCache;
}
async function gotrue(path, body, token) {
  const key = await authKey();

}
function loadSession() { try { const s = JSON.parse(localStorage.getItem(SESSION_KEY)); return s?.access_token && s.user?.id ? s : null; } catch (e) { return null; } }
function keepSession(d) {

  try { localStorage.setItem(SESSION_KEY, JSON.stringify(s)); } catch (e) {}
  return s;
}
async function refresh() {
  const s = loadSession();

}

}
// Same-origin API call. One refresh on 401, then the session counts as expired.
async function api(path, opts = {}, auth = false) {
  const send = s => call(path, { ...opts, headers: { "Content-Type": "application/json", ...(opts.headers || {}), ...(s ? { Authorization: "Bearer " + s.access_token } : {}) } });
  if (!auth) return send(null);
  let s = await token();
  if (!s) { signedOut("expired"); throw new Fail(401, "authentication_required"); }
  try { return await send(s); }
  catch (e) {
    if (e.status !== 401) throw e;
    s = await refresh();
    if (!s) { signedOut("expired"); throw e; }
    try { return await send(s); } catch (e2) { if (e2.status === 401) signedOut("expired"); throw e2; }
  }
}

let homeCard = null;
function fitHomeCard() {

/* Swipe to open: drag the knob to the end of the green track. Enter or Space also opens it. */
function nudgeSwipe() {
  const t = $("simSwipe"); if (!t || t.hasAttribute("data-disabled") || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  t.classList.remove("nudge"); void t.offsetWidth; t.classList.add("nudge");
}
function bindSwipe() {
  const track = $("simSwipe"), knob = $("simPlay"); if (!track || !knob) return;
  const fill = track.querySelector(".swipe-fill"), label = track.querySelector(".swipe-label");
  let drag = null, done = false;
  const max = () => track.clientWidth - knob.offsetWidth - 10;
  const set = x => { knob.style.transform = `translateX(${x}px)`; fill.style.width = (x + knob.offsetWidth + 10) + "px"; label.style.opacity = String(Math.max(0, 1 - x / (max() * .7))); };
  const back = () => { knob.classList.remove("dragging"); track.classList.remove("dragging"); set(0); };
  knob.addEventListener("pointerdown", e => {
    if (knob.disabled || done || e.button !== 0) return;
    drag = { id: e.pointerId, x0: e.clientX, moved: false };
    try { knob.setPointerCapture(e.pointerId); } catch {}
    knob.classList.add("dragging"); track.classList.add("dragging"); audio();
  });
  knob.addEventListener("pointermove", e => {
    if (!drag || drag.id !== e.pointerId) return;
    const x = Math.max(0, Math.min(max(), e.clientX - drag.x0));
    if (x > 4) drag.moved = true;
    set(x);
  });
  const end = (e, cancel) => {
    if (!drag || drag.id !== e.pointerId) return;
    const x = Math.max(0, Math.min(max(), e.clientX - drag.x0)), moved = drag.moved; drag = null;
    if (!cancel && x >= max() * .82) {
      done = true; knob.classList.remove("dragging"); track.classList.remove("dragging"); track.classList.add("opened"); set(max()); buzz(12);
      setTimeout(() => { playSimulation(); if (!document.querySelector(".opener")) { done = false; track.classList.remove("opened"); back(); } }, 200);
      return;
    }
    back(); if (!moved && !cancel) nudgeSwipe();
  };
  knob.addEventListener("pointerup", e => end(e, false));
  knob.addEventListener("pointercancel", e => end(e, true));
  knob.addEventListener("lostpointercapture", e => end(e, true));
  knob.addEventListener("click", e => { if (e.detail === 0 && !knob.disabled) playSimulation(); });
}

/* Redeem or sell back one free-play card. One confirmation shows the exact offer and where the credits go.

    }

// Supabase sends confirmed users back with the session (or an error) in the URL hash.
async function takeRedirect() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (!h.get("access_token") && !h.get("error")) return null;
  history.replaceState(null, "", location.pathname + location.search);
  if (h.get("error")) return { error: h.get("error_description") || h.get("error") };
  try {
    const user = await gotrue("user", undefined, h.get("access_token"));
    return { session: keepSession({ access_token: h.get("access_token"), refresh_token: h.get("refresh_token"), expires_at: h.get("expires_at"), expires_in: h.get("expires_in"), user }) };
  } catch (e) { return { error: failText(e) }; }
}

function openFlow() {

  if (p.demo) return;
  if (!S.user) return accountSheet("Sign in to open a test pack.");
  let a = pendingFor(S.user.id);
  if (a && a.pack_id !== p.id) return pendingSheet(a);

async function send(a) {

  closeSheet();

    r = await api("/api/orders", { method: "POST", headers: { "Idempotency-Key": a.key }, body: JSON.stringify({ pack_id: a.pack_id }) }, true);
    if (!r?.order?.id || !r?.pull?.id) throw new Fail(502, "bad_order_response");
  } catch (e) {

    await animate(pack, [{ transform: "rotate(-3deg) scale(1)" }, { transform: "rotate(-2deg) scale(.97)" }, { transform: "rotate(0deg) scale(1)" }], { duration: 160, easing: "ease-out" });
    if (phase !== "opening") return;
    sfx("rip"); buzz(12);
    q(".rip-seam").hidden = true; q(".rip-touch").hidden = true;
    animate(q(".rip-cap"), [{ transform: capStart, opacity: capOpacity }, { transform: "translate3d(-145px,-110px,0) rotate(-35deg)", opacity: 0 }], { duration: 560, easing: "cubic-bezier(.16,.8,.3,1)" });
    animate(q(".rip-body"), [{ transform: "translate3d(0,0,0) rotate(0deg)", opacity: 1 }, { transform: "translate3d(-16px,100px,0) rotate(-8deg)", opacity: 0 }], { duration: 650, delay: 120, easing: "cubic-bezier(.4,0,.8,1)" });
    animate(halo, [{ opacity: 0, transform: "scale(.65)" }, { opacity: .85, transform: "scale(1)" }, { opacity: .45, transform: "scale(1)" }], { duration: 1200, easing: "ease-out" });
    q(".rip-shards").querySelectorAll("i").forEach((el, i) => {
      const dx = (i - 2.5) * 32, dy = -28 - (i % 3) * 18;
      animate(el, [{ opacity: 0, transform: "translate(0,0) rotate(0deg)" }, { opacity: .65, offset: .15 }, { opacity: 0, transform: `translate(${dx}px,${dy}px) rotate(${i * 40 - 90}deg)` }], { duration: 600, delay: i * 12, easing: "ease-out" });
    });
    await animate(card, [{ opacity: 0, transform: "translate3d(0,65px,0) rotate(-7deg) scale(.78)" }, { opacity: 1, offset: .2 }, { opacity: 1, transform: "translate3d(0,-12px,0) rotate(-5deg) scale(1.02)", offset: .8 }, { opacity: 1, transform: "translate3d(0,0,0) rotate(-3deg) scale(1)" }], { duration: 780, delay: 60, easing: "cubic-bezier(.18,.8,.24,1)" });
    }
    if (phase !== "opening") return;
    pack.hidden = true;
    if (!res.preview) await animate(turn, [{ transform: "rotateY(0deg)" }, { transform: "rotateY(180deg)" }], { duration: 460, easing: "cubic-bezier(.25,.6,.2,1)" });
    if (phase !== "opening") return;
    const played = sfx("impact"); buzz(10);
    if (res.preview) q(".reward-status").textContent = played ? "Played: " + REWARD_SOUNDS.find(s => s.id === selectedReward).name + " · choose another to compare" : "Sound unavailable or muted · enable sound and retry";
    animate(halo, [{ opacity: .8, transform: "scale(1.04)" }, { opacity: .45, transform: "scale(1)" }], { duration: 380, easing: "ease-out" });
    animate(card, [{ transform: "rotate(-3deg) scale(1)" }, { transform: "rotate(1deg) scale(1.025)", offset: .55 }, { transform: "rotate(0deg) scale(1)" }], { duration: 560, easing: "cubic-bezier(.16,.8,.3,1)" });
    await animate(q(".rip-gleam"), [{ transform: "translateX(-115%)" }, { transform: "translateX(115%)" }], { duration: 360, easing: "ease-in-out" });
    if (phase === "opening") finish();
  }
  function onKey(e) {
    if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); dispose(); return; }
    if (e.key !== "Tab") return;
    const controls = [...o.querySelectorAll("button:not([disabled]), a[href]")].filter(el => !el.hidden && el.getClientRects().length);
    if (!controls.length) return;
    const first = controls[0], last = controls[controls.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
  function onVisibility() { if (document.hidden && phase === "opening") finish(); }
  document.addEventListener("keydown", onKey, true);
  document.addEventListener("visibilitychange", onVisibility);
  q(".rip-close").onclick = dispose;
  if (res.landing) q(".rip-skip").hidden = true;
  q(".rip-skip").onclick = finish;
  q(".rip-sound").onclick = e => { S.muted = !S.muted; if (S.muted) stopContact(); else { audio(); prepareContact(); } e.currentTarget.innerHTML = icon(S.muted ? "muted" : "sound"); e.currentTarget.setAttribute("aria-label", S.muted ? "Turn sound on" : "Mute sound"); };
  pack.onclick = rip;
  let dragged = false;
  pack.onclick = e => { if (dragged) { dragged = false; e.preventDefault(); return; } rip(); };
  pack.addEventListener("pointerdown", e => { if (phase !== "ready") return; pointer = { id: e.pointerId, x: e.clientX, y: e.clientY, progress: 0 }; dragged = false; audio(); prepareContact(); pack.setPointerCapture?.(e.pointerId); });
  pack.addEventListener("pointermove", e => {
    if (pointer?.id !== e.pointerId || phase !== "ready") return;
    const dx = res.preview ? pointer.y - e.clientY : pointer.x - e.clientX;
    pointer.progress = Math.min(1, Math.max(0, dx / Math.max(70, pack.clientWidth * .45)));
    if (Math.abs(dx) > 6) dragged = true;
    if (!reduced) {
      (res.preview ? q(".rip-body") : q(".rip-cap")).style.transform = "translate3d(" + (-pointer.progress * 65) + "px," + (-pointer.progress * 32) + "px,0) rotate(" + (-pointer.progress * 22) + "deg)";
      if (!res.preview) q(".rip-cap").style.opacity = 1 - pointer.progress * .3;
      pack.style.transform = "rotate(" + (-3 + pointer.progress * 4) + "deg)";
    }
    q(".rip-hint").textContent = pointer.progress >= .72 ? "Release to reveal" : (res.preview ? "↑ Release your card" : "← Keep pulling the seal");
  });
  function releaseSeal(e) {
    if (pointer?.id !== e.pointerId) return;
    const complete = e.type === "pointerup" && pointer.progress >= .72;
    pointer = null;
    if (complete) { rip(); return; }
    if (phase === "ready") {
      const cap = res.preview ? q(".rip-body") : q(".rip-cap");
      if (!reduced) { animate(cap, [{ transform: cap.style.transform || "none", opacity: cap.style.opacity || 1 }, { transform: "none", opacity: 1 }], { duration: 180, easing: "ease-out", fill: "none" }); }
      cap.style.transform = ""; cap.style.opacity = ""; pack.style.transform = "";
      q(".rip-hint").textContent = res.preview ? "Tap the plate to drop your card" : "← Drag the seal to rip, or tap the pack";
    }
  }
  for (const event of ["pointerup", "pointercancel", "lostpointercapture"]) pack.addEventListener(event, releaseSeal);
  function readyToOpen() {
    if (phase === "closed") return;
    phase = "ready"; pack.disabled = false; pack.style.opacity = "1";
    pack.focus({ preventScroll: true });
    q(".rip-hint").textContent = "Tap the plate to drop your card";
    o.querySelectorAll("[data-reward]").forEach(b => b.disabled = !rewardBuffers.has(b.dataset.reward));
    o.querySelectorAll("[data-study]").forEach(b => b.disabled = false);
    if (q(".reward-status")) q(".reward-status").textContent = "Selected: " + REWARD_SOUNDS.find(s => s.id === selectedReward).name;
  }
  async function serve() {
    if (!physical) return;
    phase = "arriving"; pack.disabled = true;
    o.querySelectorAll("[data-reward], [data-study]").forEach(b => b.disabled = true);
    if (q(".reward-status")) q(".reward-status").textContent = "Your plate is arriving…";
    q(".rip-hint").textContent = "Something good is being served.";
    const stage = await sceneReady;
    if (phase === "closed") return;
    if (phase === "revealed") { stage?.finish(); return; }
    if (stage) { await stage.serve(); if (phase === "arriving") readyToOpen(); return; }
    if (reduced) { q(".serving-plate").style.opacity = "1"; readyToOpen(); return; }
    pack.style.opacity = "0";
    await animate(q(".serving-plate"), [{ opacity: 0, transform: "translateY(-150px) scale(.9)" }, { opacity: 1, transform: "translateY(5px) scale(1.04)", offset: .75 }, { opacity: 1, transform: "none" }], { duration: 430, easing: "cubic-bezier(.2,.7,.25,1)" });
    if (phase !== "arriving") return;
    sfx("plate");
    await animate(pack, [{ opacity: 0, transform: "translateY(-190px) rotate(5deg)" }, { opacity: 1, offset: .2 }, { opacity: 1, transform: "translateY(6px) rotate(-1deg)", offset: .75 }, { opacity: 1, transform: "none" }], { duration: 470, easing: "cubic-bezier(.2,.7,.25,1)" });
    if (phase !== "arriving") return;
    sfx("cover"); readyToOpen();
  }
  const arrival = serve();
  o.startOpening = async () => { await arrival; return rip(); };
  pack.focus({ preventScroll: true });
  return o;
}


/* ---------- Sheets ---------- */
function closeSheet() { document.querySelectorAll(".scrim").forEach(m => m.remove()); }
function sheet(html, label, closable = true) {
  closeSheet();
  const m = document.createElement("div");
  m.className = "scrim";
  m.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(label)}"><span class="grab" aria-hidden="true"></span>${closable ? `<button class="x" type="button" aria-label="Close">${icon("close")}</button>` : ""}${html}</div>`;
  document.body.appendChild(m);
  m.addEventListener("click", e => { if (e.target === m && !busy) closeSheet(); });
  m.querySelector(".x")?.addEventListener("click", closeSheet);
  return m;
}
function showResult(r, o) {
  const close = () => { if (o.closeOpening) o.closeOpening(); else o.remove(); };
  const q = id => o.querySelector("#" + id);
  if (r.sim) { simDecision(q("ores"), r.round.number, close); return; }
  if (r.preview) {
    q("ores").innerHTML = `<span class="rp" style="background:#d8b46516;color:#d8bc83">${r.landing ? "STARTER DEMO" : "PACK PREVIEW"}</span><h2>${r.landing ? "Your first reveal." : esc(CARD_STUDIES.find(b=>b.id===selectedCard)?.name || r.p.name)}</h2><p class="sub">${r.landing ? "Sample artwork. Not redeemable or saved. Drag the card to catch the light." : "Restaurant design preview. No order or gift card created. Drag the card to inspect it."}</p><div class="sacts"><button class="btn light" id="previewReplay" type="button">${r.landing ? "Open again" : "Replay opening"}</button><button class="btn soft" id="previewBack" type="button">${r.landing ? "Explore packs" : "Back to pack"}</button></div>`;
    q("previewReplay").onclick = () => { close(); previewOpening(r.p, r.landing); };
    q("previewBack").onclick = close;
    return;
  }
  if (r.api) {
    o.querySelector("#ores").innerHTML = `<span class="rp" style="--rb:rgba(245,184,74,.14);--rf:#f5c26b">Test card · NOT REDEEMABLE</span>
      <p class="eyebrow">You pulled</p>
      <h2>${esc(r.pull.restaurant_label)}</h2><p class="sub">Simulated delivery · order ${esc(String(r.order.id).slice(0, 8))}</p>
      <div class="vline"><span><b>${money(r.value)}</b></span><span>Added to your wallet</span></div>
      <div class="sacts"><button class="btn light" id="sWallet" type="button">View wallet</button><button class="btn soft" id="sMore" type="button">Open another</button></div>`;
    q("sWallet").onclick = () => { close(); go("wallet"); };
    q("sMore").onclick = () => { close(); render(); };
    return;
  }
  // Free pick: a local suggestion with no card.
  const { s } = r, paid = S.catalog?.find(x => x.id === "quick-bite");
  o.querySelector("#ores").innerHTML = `
    <p class="eyebrow">How about tonight at</p>
    <h2>${esc(s.n)}</h2><p class="sub">${esc(s.c)} · ${CITY} · suggestion only, no card</p>
    <div class="sacts">${paid ? `<button class="btn light" id="sPaid" type="button" style="grid-column:1/-1">Open a test pack · ${esc(paid.name)} ${money(paid.price)}</button>` : ""}<button class="btn soft" id="sAgain" type="button">Pick again</button><a class="btn soft" href="${maps(s.n)}" target="_blank" rel="noopener">Directions</a></div>`;
  if (q("sPaid")) q("sPaid").onclick = () => { close(); go("pack", { packId: paid.id, from: "home", slide: 3 }); };
  q("sAgain").onclick = () => { close(); openFlow(); };
}
function showCard(i) {
  const w = S.pulls[i];
  sheet(`<div class="slot">${gc(pullSpot(w), "", w.face_value_cents / 100)}</div>
    <div class="result"><p class="eyebrow">Test card · NOT REDEEMABLE</p><h2>${esc(w.restaurant_label)}</h2>
      <div class="valuebox"><span><b>${money(w.face_value_cents / 100)}</b></span><span>Delivery: ${esc(w.delivery_status || "simulated")}</span></div>
      <p class="sub" style="text-align:center;margin-top:10px">Test mode issues no barcode or code. This card can't be used at a restaurant.</p>
      <p class="sub" style="text-align:center;margin-top:4px">Card ${esc(String(w.id).slice(0, 8))} · order ${esc(String(w.order_id).slice(0, 8))} · ${esc(when(w.created_at))}</p></div>`, "Test card");
}
function showBrand(s) {
  const packs = DEMO.filter(p => p.spots.includes(s));
  const m = sheet(`<div class="slot">${gc(s)}</div>
    <div class="result"><h2>${esc(s.n)}</h2><p class="sub">${esc(s.c)} · cards from ${money(s.min)} to ${money(s.max)} · demo catalog</p>
      <p class="eyebrow" style="margin-top:14px">${packs.length ? `In ${packs.length} demo theme${packs.length === 1 ? "" : "s"}` : "Not in a demo theme yet"}</p>
      <div class="inpacks">${packs.map(p => `<button type="button" data-pack="${p.id}">${esc(p.name)}<span>Demo only</span></button>`).join("")}</div></div>`, s.n);
  m.querySelectorAll("[data-pack]").forEach(b => b.onclick = () => go("pack", { packId: b.dataset.pack, from: "cards" }));
}

/* ---------- Bindings ---------- */
const bind = {
  home() {
    bindSwipe();
    $("simInside").onclick = insideSheet;
    mountHomeCard();
    if ($("simPending")) $("simPending").onclick = () => go("collection", { colFilter: "open" });
  },
  collection() {
    if ($("colPlay")) $("colPlay").onclick = () => go("home");
    $("view").querySelectorAll("[data-col]").forEach(b => b.onclick = () => { S.colFilter = b.dataset.col; render(); });
    $("view").querySelectorAll("[data-num]").forEach(b => b.onclick = () => colCardSheet(+b.dataset.num));
  },
  profile() {
    $("pRefill").onclick = simulationBalance;
    $("pRules").onclick = simulationRules;
    $("pSound").onclick = () => { S.muted = !S.muted; render(); };
    $("pAccount").onclick = () => accountSheet();
    $("pDev").onclick = () => go("browse");
    $("pReset").onclick = resetSheet;
  },
  browse() {
    $("pOpen").onclick = () => { const p = packOf("quick-bite"); if (p) previewOpening(p, false, true); };
    $("view").querySelectorAll("[data-cat]").forEach(b => b.onclick = () => { S.cat = S.cat === b.dataset.cat ? "all" : b.dataset.cat; $("view").querySelectorAll("[data-cat]").forEach(c => c.setAttribute("aria-pressed", c.dataset.cat === S.cat)); renderPacks(); });
    renderPacks();
  },
  pack() {
    if (!packOf(S.packId).api) setSlide(S.slide);
    if ($("previewOpening")) $("previewOpening").onclick = () => previewOpening(packOf(S.packId));
    if (packOf(S.packId).api) {
      $("view").querySelectorAll("[data-restaurant-preview]").forEach(button => button.onclick = () => { selectedCard = button.dataset.restaurantPreview; previewOpening(packOf(S.packId), false, true); });
      return;
    }
    $("prev").onclick = () => setSlide(S.slide - 1); $("next").onclick = () => setSlide(S.slide + 1);
    document.querySelectorAll("#dots [data-dot]").forEach(d => d.onclick = () => setSlide(+d.dataset.dot));
    let x0 = null; const st = $("stage");
    st.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, { passive: true });
    st.addEventListener("touchend", e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 40) setSlide(S.slide + (dx < 0 ? 1 : -1)); x0 = null; });
  },
  cards() { renderShelf(); },
  wallet() {
    if ($("toHome")) $("toHome").onclick = () => go("home");
    if ($("wSign")) $("wSign").onclick = () => accountSheet();
    if ($("wRetry")) $("wRetry").onclick = loadWallet;
    $("view").querySelectorAll("[data-i]").forEach(b => b.onclick = () => showCard(+b.dataset.i));
  }
};

async function start(data) {
  S = Object.assign(fresh(), (data && data.S) || {}, { catalog: null, pulls: [], user: null, wstate: "signedout" });
  // The old play-money wallet held fabricated cards and barcodes; it is never shown as inventory.
  try { localStorage.removeItem("chefpack.app.v3"); } catch (e) {}
  if (!({ home: 1, collection: 1, profile: 1, browse: 1, cards: 1, wallet: 1 })[S.page]) S.page = "home";
  busy = false;
  $("view").addEventListener("scroll", () => $("top").classList.toggle("shadow", $("view").scrollTop > 4), { passive: true });
  addEventListener("keydown", e => { if (e.key === "Escape" && !busy) { closeSheet(); document.querySelector(".opener")?.remove(); } });
  render();
  const catalog = loadCatalog();
  loadRestaurantDirectory();
  const back = await takeRedirect();
  await catalog;
  const s = back?.session || loadSession();
  if (s) signedIn(s);
  if (back?.error) accountSheet(back.error);
}
window.claude?.hot?.snapshot?.(() => ({ S }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
